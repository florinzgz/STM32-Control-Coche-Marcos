; =============================================================================
; ESP32-S3 HMI Firmware — PlatformIO Configuration
;
; Framework:  Arduino ONLY (no ESP-IDF)
; Language:   C++ (C++17)
; Board:      ESP32-S3-DevKitC-1-N16R8
; Display:    480×320 TFT via TFT_eSPI (ST7796 driver, landscape rotation 1)
; CAN Bus:    500 kbps via TJA1051 transceiver (GPIO4 TX, GPIO5 RX)
;
; Reference:  docs/ESP32_FIRMWARE_DESIGN.md
;             docs/CAN_CONTRACT_FINAL.md rev 1.3
;             docs/HMI_RENDERING_STRATEGY.md
; =============================================================================

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino

; ---------- Flash & PSRAM (ESP32-S3-WROOM-1-N16R8) ----------------
; Flash: 16 MB Quad, PSRAM: 8 MB Octal (detected as AP_3v3 by esptool)
; WARNING: qio_opi is specific to Octal PSRAM hardware.
;          Other board variants may require different memory_type.
; NOTE: Do NOT set board_build.f_flash here. The board definition already
;       provides f_flash = 80000000L (80 MHz). Setting it to a bare number
;       like 80 causes PlatformIO to generate an invalid bootloader filename
;       (bootloader_qio_0m.elf instead of bootloader_qio_80m.elf) because
;       PlatformIO expects the value in Hz, not MHz.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; C++ standard
; build_flags applies to both project source AND library dependencies.
; Keep only common flags here; -Wall/-Wextra go in build_src_flags so
; that library code (FastLED, TFT_eSPI) is not polluted with warnings
; we cannot fix upstream.
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=1  ; Required for psramInit() and PSRAM APIs
    ; Force-include the project's User_Setup.h before every translation
    ; unit so TFT_eSPI (and any other lib) sees TOUCH_CS, ST7796_DRIVER,
    ; etc. instead of the library's default User_Setup.h.
    -include $PROJECT_DIR/include/User_Setup.h

; Strict warnings for project source only (not applied to libraries).
build_src_flags =
    -Wall
    -Wextra

build_unflags =
    -std=gnu++11

; ---------- Upload settings (ESP32-S3 native USB-CDC) -----------
; The ESP32-S3 DevKitC uses the built-in USB peripheral for both serial
; monitor and firmware upload.  PlatformIO usually auto-detects the port,
; but if you get "Could not open COMx" or "PermissionError" on Windows:
;   1. Close any serial monitor / terminal that is using the port.
;   2. Hold the BOOT button, press RESET, then release BOOT to enter
;      download mode before uploading.
;   3. Uncomment the line below and set it to the correct port:
;        Windows  →  upload_port = COM3   (check Device Manager)
;        Linux    →  upload_port = /dev/ttyACM0
;        macOS    →  upload_port = /dev/cu.usbmodem*
upload_port = COM11
upload_speed = 921600

; Serial monitor
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Library dependencies
lib_deps =
    handmade0octopus/ESP32-TWAI-CAN@^1.0.1
    bodmer/TFT_eSPI@^2.5.43
    fastled/FastLED@^3.9.12
