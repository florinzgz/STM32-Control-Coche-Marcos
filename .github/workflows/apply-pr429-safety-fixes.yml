name: Apply PR429 safety fixes

on:
  push:
    branches:
      - fix/can-heartbeat-deterministic
    paths:
      - '.github/workflows/apply-pr429-safety-fixes.yml'

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/can-heartbeat-deterministic
          fetch-depth: 0

      - name: Apply audited safety corrections
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement, flags=0):
              text = read(path)
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one regex match, got {count}: {pattern[:100]!r}')
              write(path, new_text)

          # -----------------------------------------------------------------
          # INA226 CH5: zero current is normal while the steering motor is idle.
          # Only diagnose shunt/polarity faults while real steering PWM exists.
          # -----------------------------------------------------------------
          replace_once(
              'Core/Inc/ina226_channel_diag.h',
              '    INA226_CH_OK = 0,                 /* Present, valid, current flowing     */',
              '    INA226_CH_OK = 0,                 /* Present, valid, no proven fault     */')
          replace_once(
              'Core/Inc/ina226_channel_diag.h',
              '    bool     channel_powered;         /* Power branch expected energised     */\n',
              '    bool     channel_powered;         /* Power branch expected energised     */\n'
              '    bool     current_expected;        /* Real steering PWM is being emitted  */\n')

          replace_once(
              'Core/Src/ina226_channel_diag.c',
              '''    /* 2. No ACK at the expected address ⇒ genuinely missing (Problem 4B).
               *    This is the "CH5 MISSING / address 0x40 no ACK" case. */
              if (!d->i2c_ack) {
                  return INA226_CH_MISSING;
              }
          ''',
              '''    /* 2. A branch that is intentionally unpowered is not a missing INA.
               *    The mux itself is still checked above, but the downstream device is
               *    not expected to ACK until its steering-power relay is energised. */
              if (!d->channel_powered) {
                  return INA226_CH_UNKNOWN;
              }

              /* 3. No ACK at the expected address while powered ⇒ genuinely missing. */
              if (!d->i2c_ack) {
                  return INA226_CH_MISSING;
              }
          ''')
          replace_once(
              'Core/Src/ina226_channel_diag.c',
              '''    /* 7. Present, fresh reading. Reversed installation shows a real,
               *    sizeable negative current under forward demand ⇒ POLARITY_REVERSED. */
              if (d->signed_current_ma <= -INA226_DIAG_REVERSED_MA) {
                  return INA226_CH_POLARITY_REVERSED;
              }

              /* 8. Present, fresh, but essentially no shunt drop ⇒ the external shunt
               *    / R002 pads are the problem (chip fine, no current path sensed). */
              if (diag_abs32(d->shunt_uv) < INA226_DIAG_SHUNT_FLOOR_UV) {
                  return INA226_CH_PRESENT_NO_SHUNT;
              }
          ''',
              '''    /* 8. Shunt and polarity conclusions require actual motor demand.
               *    At idle, 0 A and ~0 µV are the correct readings and must remain OK. */
              if (d->current_expected &&
                  d->signed_current_ma <= -INA226_DIAG_REVERSED_MA) {
                  return INA226_CH_POLARITY_REVERSED;
              }

              if (d->current_expected &&
                  diag_abs32(d->shunt_uv) < INA226_DIAG_SHUNT_FLOOR_UV) {
                  return INA226_CH_PRESENT_NO_SHUNT;
              }
          ''')

          replace_once(
              'Core/Src/sensor_manager.c',
              'extern I2C_HandleTypeDef hi2c1;\n',
              'extern I2C_HandleTypeDef hi2c1;\nextern TIM_HandleTypeDef htim3;\n')
          replace_once(
              'Core/Src/sensor_manager.c',
              '    d.channel_powered  = (ina_expected_mask & INA226_MASK_STEER) != 0U;\n',
              '''    d.channel_powered  = (ina_expected_mask & INA226_MASK_STEER) != 0U;
              /* Diagnose a missing/bypassed steering shunt only while the hardware is
               * genuinely driving.  A powered but idle INA226 must read 0 A without
               * being labelled PRESENT NO SHUNT.  TIM3 CCR1/CCR2 are the final PWM
               * values actually emitted to the steering BTS7960. */
              d.current_expected = d.channel_powered &&
                  ((__HAL_TIM_GET_COMPARE(&htim3, TIM_CHANNEL_1) > 0U) ||
                   (__HAL_TIM_GET_COMPARE(&htim3, TIM_CHANNEL_2) > 0U));
          ''')

          # -----------------------------------------------------------------
          # Relay diagnosis: use a true near-zero floor, and permit a control
          # fault only when the evidence classifier says CONFIRMED.
          # -----------------------------------------------------------------
          replace_once(
              'Core/Inc/relay_health_diag.h',
              'RelayDiagReason_t Relay_ClassifyHealth(const RelayHealthDiag *d);\n',
              '''RelayDiagReason_t Relay_ClassifyHealth(const RelayHealthDiag *d);

              /**
               * @brief Policy gate for the safety latch.  Only independently confirmed
               *        relay-open evidence may create DTC 16 / DEGRADED.  Suspected,
               *        stale or current-sense diagnoses remain visible but report-only.
               */
              bool Relay_DiagMayLatchOpenFault(RelayDiagReason_t reason);
          ''')
          replace_once(
              'Core/Src/relay_health_diag.c',
              '''/* Treat "no measurable current" as anything below the detection threshold
               * (or a small floor when the threshold itself is not yet populated). */
              static bool diag_current_effectively_zero(const RelayHealthDiag *d)
              {
                  float floor_a = (d->current_threshold > 0.1f) ? d->current_threshold : 0.5f;
                  return (d->current_sum_abs < floor_a);
              }
          ''',
              '''/* A relay-open conclusion requires genuinely near-zero current, not merely
               * current below the adaptive load expectation.  Wheels lifted from the floor
               * can legitimately spin below 1 A; treating the 1.5-4 A adaptive threshold as
               * "zero" caused the false DTC 16 seen during no-load tests. */
              #define RELAY_DIAG_ZERO_CURRENT_A 0.10f
              static bool diag_current_effectively_zero(const RelayHealthDiag *d)
              {
                  return (d->current_sum_abs < RELAY_DIAG_ZERO_CURRENT_A);
              }
          ''')
          replace_once(
              'Core/Src/relay_health_diag.c',
              'const char *Relay_DiagReasonStr(RelayDiagReason_t reason)\n',
              '''bool Relay_DiagMayLatchOpenFault(RelayDiagReason_t reason)
              {
                  return (reason == RELAY_OPEN_CONFIRMED);
              }

              const char *Relay_DiagReasonStr(RelayDiagReason_t reason)
          ''')

          # DEGRADED entered directly from STANDBY must start traction power-up.
          replace_once(
              'Core/Src/safety_system.c',
              '''                system_state = SYS_STATE_DEGRADED;
                              /* Do NOT call Safety_FailSafe() — keep relays on.
                               * Traction demand is limited via Safety_ValidateThrottle(). */
          ''',
              '''                system_state = SYS_STATE_DEGRADED;
                              /* DEGRADED is drive-capable.  When entered directly from
                               * STANDBY, start the same non-blocking traction power-up used
                               * by ACTIVE/LIMP_HOME.  Re-entry is a no-op after ACTIVE. */
                              Relay_PowerUp();
                              /* Do NOT call Safety_FailSafe() — traction remains available
                               * under the degraded power/speed limits. */
          ''')

          # Replace relay sequencer with a drive-capable, calibration-aware version.
          regex_once(
              'Core/Src/safety_system.c',
              r'void Relay_SequencerUpdate\(void\)\n\{.*?\n\}\n\nvoid Relay_PowerDown',
              '''void Relay_SequencerUpdate(void)
              {
                  /* ACTIVE, DEGRADED and LIMP_HOME are all explicitly drive-capable.
                   * The previous ACTIVE-only gate powered the traction relay back down
                   * on STANDBY->DEGRADED/LIMP_HOME, leaving power_ready=false forever. */
                  bool drive_capable = (system_state == SYS_STATE_ACTIVE) ||
                                       (system_state == SYS_STATE_DEGRADED) ||
                                       (system_state == SYS_STATE_LIMP_HOME);

                  if (!drive_capable) {
                      /* Never leave a half-completed traction sequence outside a
                       * drive-capable state.  SAFE/ERROR normally already power down. */
                      if (relay_seq_state == RELAY_SEQ_TRACTION_ON) {
                          Relay_PowerDown();
                      }
                      return;
                  }

                  uint32_t now = HAL_GetTick();
                  if (relay_seq_state == RELAY_SEQ_TRACTION_ON &&
                      (now - relay_seq_timestamp) >= RELAY_TRACTION_SETTLE_MS) {
                      /* Traction can remain fail-operational without assisted steering.
                       * Keep the 12 V steering bridge physically OFF until the physical
                       * centre has been validated; this prevents electrical braking or
                       * blind EPS effort after a centering fault. */
                      HAL_GPIO_WritePin(GPIOC, PIN_RELAY_STEER_PWR,
                          Steering_IsCalibrated() ? GPIO_PIN_SET : GPIO_PIN_RESET);
                      relay_seq_state = RELAY_SEQ_COMPLETE;
                  }
              }

              void Relay_PowerDown''',
              flags=re.S)

          # DEBUG consistency must allow COMPLETE with steering intentionally off.
          replace_once(
              'Core/Src/safety_system.c',
              '''#ifdef DEBUG
                  /* Consistency assertion: COMPLETE implies both relays ON.
                   * Checks bits 1 and 2 (0b0110 = 0x06).  If this fires, the relay
                   * sequencer or power-down has a bug.  No runtime side-effect.       */
                  if ((relay_seq_state == RELAY_SEQ_COMPLETE) && ((status & 0x06U) != 0x06U)) {
                      /* Breakpoint trap for SWD debugger — NOP in release builds */
                      __NOP();
                  }
              #endif
          ''',
              '''#ifdef DEBUG
                  /* COMPLETE always requires traction.  STEER_PWR is required only after
                   * successful physical centering; while uncalibrated it must stay OFF. */
                  uint8_t required = (1U << 1);
                  if (Steering_IsCalibrated()) required |= (1U << 2);
                  if ((relay_seq_state == RELAY_SEQ_COMPLETE) &&
                      ((status & required) != required)) {
                      __NOP();
                  }
                  if ((relay_seq_state == RELAY_SEQ_COMPLETE) &&
                      !Steering_IsCalibrated() && (status & (1U << 2))) {
                      __NOP();
                  }
              #endif
          ''')

          # Replace the contradictory moving-wheel relay latch with classifier policy.
          replace_once(
              'Core/Src/safety_system.c',
              '''                const TractionState_t *ts = Traction_GetState();
                              uint8_t any_wheel_moving = (avg_speed > RELAY_CHK_STALL_SPEED_KMH) ? 1 : 0;
                              if (ts != (void *)0 && ts->demandPct > 0.0f &&
                                  any_wheel_moving) {
          ''',
              '''                const TractionState_t *ts = Traction_GetState();
                              RelayDiagReason_t diag_reason = s_relay_diag.diagnostic_reason;
                              if (ts != (void *)0 && ts->demandPct > 0.0f &&
                                  Relay_DiagMayLatchOpenFault(diag_reason)) {
          ''')
          replace_once(
              'Core/Src/safety_system.c',
              '                    /* Confirmed relay-open fault */\n',
              '''                    /* Independently confirmed relay-open fault only.
                               * Moving wheels, stale/missing INAs, low-load current and
                               * CURRENT_SENSE_INVALID can never enter this control path. */
          ''')

          # -----------------------------------------------------------------
          # Steering homing: on abort release both PWM/EN and the 12 V rail,
          # then enter true 20%/5 km/h LIMP_HOME instead of generic DEGRADED.
          # -----------------------------------------------------------------
          replace_once(
              'Core/Src/steering_centering.c',
              '''/**
               * @brief  Abort centering: stop motor, latch fault, enter DEGRADED.
               *
               * Centering failure enters DEGRADED (not SAFE) to preserve the base
               * firmware's "drive-home" philosophy.  The vehicle can still operate
               * at reduced power with steering neutralised.  Traced to
               * limp_mode.cpp: !steeringCentered → LimpState::LIMP.
               */
              static void Centering_Abort(void)
              {
                  Steering_Neutralize();
                  centering_state = CENTERING_FAULT;
                  Safety_SetError(SAFETY_ERROR_CENTERING);
                  Safety_SetState(SYS_STATE_DEGRADED);
                  Safety_SetDegradedLevel(DEGRADED_L1,
                                          DEGRADED_REASON_CENTERING_FAIL);
              }
          ''',
              '''/**
               * @brief Abort centering, electrically release steering and preserve
               *        walking-speed fail-operational traction.
               */
              static void Centering_Abort(void)
              {
                  Steering_Neutralize();
                  /* Homing energises PC12 directly while in STANDBY.  Neutralising PWM
                   * alone is insufficient if an external EN is strapped high or a bridge
                   * fault leaves the motor electrically braked, so remove the 12 V rail. */
                  HAL_GPIO_WritePin(GPIOC, PIN_RELAY_STEER_PWR, GPIO_PIN_RESET);

                  centering_state = CENTERING_FAULT;
                  Safety_SetError(SAFETY_ERROR_CENTERING);

                  /* Production homing runs in STANDBY.  LIMP_HOME is the defined
                   * uncentred/manual-steering mode: 20% torque and 5 km/h. */
                  if (Safety_GetState() == SYS_STATE_STANDBY) {
                      Safety_SetState(SYS_STATE_LIMP_HOME);
                  } else {
                      Safety_SetState(SYS_STATE_DEGRADED);
                      Safety_SetDegradedLevel(DEGRADED_L1,
                                              DEGRADED_REASON_CENTERING_FAIL);
                  }
              }
          ''')
          replace_once(
              'Core/Src/steering_centering.c',
              '    s_diag.power_ready        = Safety_IsPowerReady();\n',
              '''    /* Homing owns and energises the steering rail directly in STANDBY;
               * global traction power_ready is intentionally false there.  The sweep
               * begins only after STEERING_RAIL_SETTLE_MS, so FSM state + PC12 are the
               * authoritative local power-ready evidence. */
              s_diag.power_ready = s_diag.relay_steer_commanded && sweeping;
          ''')

          # Host HAL GPIO fidelity for relay/diagnostic regression tests.
          replace_once(
              'analysis_artifacts/stubs/stm32g4xx_hal.h',
              '''static inline void HAL_GPIO_WritePin(GPIO_TypeDef *GPIOx, uint16_t GPIO_Pin, GPIO_PinState PinState)
              {
                  (void)GPIOx; (void)GPIO_Pin; (void)PinState;
              }

              static inline GPIO_PinState HAL_GPIO_ReadPin(GPIO_TypeDef *GPIOx, uint16_t GPIO_Pin)
              {
                  (void)GPIOx; (void)GPIO_Pin;
                  return GPIO_PIN_RESET;
              }

              static inline void HAL_GPIO_TogglePin(GPIO_TypeDef *GPIOx, uint16_t GPIO_Pin)
              {
                  (void)GPIOx; (void)GPIO_Pin;
              }
          ''',
              '''static inline void HAL_GPIO_WritePin(GPIO_TypeDef *GPIOx, uint16_t GPIO_Pin, GPIO_PinState PinState)
              {
                  if (GPIOx == NULL) return;
                  if (PinState == GPIO_PIN_SET) GPIOx->ODR |= GPIO_Pin;
                  else                          GPIOx->ODR &= ~(uint32_t)GPIO_Pin;
              }

              static inline GPIO_PinState HAL_GPIO_ReadPin(GPIO_TypeDef *GPIOx, uint16_t GPIO_Pin)
              {
                  if (GPIOx == NULL) return GPIO_PIN_RESET;
                  return (((GPIOx->IDR | GPIOx->ODR) & GPIO_Pin) != 0U)
                         ? GPIO_PIN_SET : GPIO_PIN_RESET;
              }

              static inline void HAL_GPIO_TogglePin(GPIO_TypeDef *GPIOx, uint16_t GPIO_Pin)
              {
                  if (GPIOx != NULL) GPIOx->ODR ^= GPIO_Pin;
              }
          ''')

          # -----------------------------------------------------------------
          # Regression tests.
          # -----------------------------------------------------------------
          for path in (
              'Core/Src/test_ina226_channel_diag.c',
              'Core/Src/test_ina226_ch5_frame.c',
              'esp32/src/test_ina226_ch5_view.cpp'):
              replace_once(path,
                  '    d.channel_powered    = true;\n' if 'channel_diag' in path else
                  '    d.channel_powered    = true;\n' if 'ch5_frame.c' in path else
                  '    d.channel_powered    = true;\n',
                  ('    d.channel_powered    = true;\n    d.current_expected   = true;\n'))

          replace_once(
              'Core/Src/test_ina226_channel_diag.c',
              '''    /* --- shunt just at the noise floor still counts as no-shunt --- */
              {
                  Ina226ChannelDiag d = base_ok_ch5();
                  d.shunt_uv = INA226_DIAG_SHUNT_FLOOR_UV - 1;
                  d.signed_current_ma = 0;
                  CHECK(classify(d) == INA226_CH_PRESENT_NO_SHUNT);
              }
          ''',
              '''    /* --- shunt just at the noise floor still counts as no-shunt under demand --- */
              {
                  Ina226ChannelDiag d = base_ok_ch5();
                  d.shunt_uv = INA226_DIAG_SHUNT_FLOOR_UV - 1;
                  d.signed_current_ma = 0;
                  CHECK(classify(d) == INA226_CH_PRESENT_NO_SHUNT);
              }

              /* --- Powered but idle: 0 A is normal, never a shunt fault. --- */
              {
                  Ina226ChannelDiag d = base_ok_ch5();
                  d.current_expected = false;
                  d.raw_shunt = 0;
                  d.shunt_uv = 0;
                  d.signed_current_ma = 0;
                  CHECK(classify(d) == INA226_CH_OK);
              }

              /* --- Intentionally unpowered branch is not reported MISSING. --- */
              {
                  Ina226ChannelDiag d = base_ok_ch5();
                  d.channel_powered = false;
                  d.current_expected = false;
                  d.i2c_ack = false;
                  d.shunt_read_ok = false;
                  d.bus_read_ok = false;
                  CHECK(classify(d) == INA226_CH_UNKNOWN);
              }
          ''')

          replace_once(
              'Core/Src/test_relay_health_diag.c',
              '''    /* --- Rule A: motors move + PWM>0 + 0 A → CURRENT_SENSE_INVALID --- */
          ''',
              '''    /* --- Low-load/no-load spin is healthy even below adaptive threshold. --- */
              {
                  RelayHealthDiag d = base_ok();
                  d.current_ch[0] = d.current_ch[1] = 0.08f;
                  d.current_ch[2] = d.current_ch[3] = 0.08f;
                  d.current_sum_abs = 0.32f;
                  d.current_signed_sum = 0.32f;
                  CHECK(classify(d) == RELAY_HEALTH_OK);
              }

              /* --- Rule A: motors move + PWM>0 + genuine 0 A → CURRENT_SENSE_INVALID --- */
          ''')
          replace_once(
              'Core/Src/test_relay_health_diag.c',
              '''        CHECK(Relay_DiagConfidenceStr(RELAY_OPEN_CONFIRMED)[0] == 'C'); /* CONFIRMADO */
              }
          ''',
              '''        CHECK(Relay_DiagConfidenceStr(RELAY_OPEN_CONFIRMED)[0] == 'C'); /* CONFIRMADO */
                  CHECK(Relay_DiagMayLatchOpenFault(RELAY_OPEN_CONFIRMED));
                  CHECK(!Relay_DiagMayLatchOpenFault(RELAY_OPEN_SUSPECTED));
                  CHECK(!Relay_DiagMayLatchOpenFault(CURRENT_SENSE_INVALID));
                  CHECK(!Relay_DiagMayLatchOpenFault(CURRENT_INA_MISSING));
                  CHECK(!Relay_DiagMayLatchOpenFault(RELAY_DIAG_INCONCLUSIVE));
                  CHECK(!Relay_DiagMayLatchOpenFault(RELAY_HEALTH_OK));
              }
          ''')

          # Steering tests mirror production: homing begins after BOOT->STANDBY.
          replace_once('Core/Src/test_steering_centering.c',
                       'static SystemState_t     s_state = SYS_STATE_BOOT;\n',
                       'static SystemState_t     s_state = SYS_STATE_STANDBY;\n')
          replace_once('Core/Src/test_steering_centering.c',
                       '    s_state = SYS_STATE_BOOT;\n',
                       '    s_state = SYS_STATE_STANDBY;\n')
          replace_once('Core/Src/test_steering_centering.c',
                       '    fake_tim3_regs.CCR1 = 0; fake_tim3_regs.CCR2 = 0;\n',
                       '    fake_tim3_regs.CCR1 = 0; fake_tim3_regs.CCR2 = 0;\n    GPIOC->ODR = 0U; GPIOC->IDR = 0U;\n')
          replace_once(
              'Core/Src/test_steering_centering.c',
              '/* ---- 3. Left-sweep stall → reversal to the right. ---- */\n',
              '''/* ---- 3. Homing power diagnostic uses the locally settled PC12 rail. ---- */
              static void test_homing_power_diag_local_rail(void)
              {
                  reset_all();
                  CHECK(drive_to_sweep_left(200));
                  CHECK((GPIOC->ODR & PIN_RELAY_STEER_PWR) != 0U);
                  CHECK(!s_power_ready);  /* global traction sequencer is idle in STANDBY */
                  SteeringCentering_UpdateDiag();
                  const SteeringCenteringDiag *d = SteeringCentering_GetDiag();
                  CHECK(d != NULL);
                  CHECK(d->relay_steer_commanded);
                  CHECK(d->power_ready);
              }

              /* ---- 4. Left-sweep stall → reversal to the right. ---- */
          ''')
          replace_once(
              'Core/Src/test_steering_centering.c',
              '''    CHECK(!motor.driven);               /* PWM/EN forced to zero */
                  CHECK(s_error == SAFETY_ERROR_CENTERING);
              }
          ''',
              '''    CHECK(!motor.driven);               /* PWM/EN forced to zero */
                  CHECK((GPIOC->ODR & PIN_RELAY_STEER_PWR) == 0U); /* 12 V rail released */
                  CHECK(s_error == SAFETY_ERROR_CENTERING);
                  CHECK(s_state == SYS_STATE_LIMP_HOME);  /* 20% / 5 km/h fail-operational */
              }
          ''')
          replace_once(
              'Core/Src/test_steering_centering.c',
              '''    /* (a) After a centering fault (system degraded), EPS owns and keeps
               *     the motor neutralised. */
          ''',
              '''    /* (a) After a centering fault (system LIMP_HOME), EPS owns and keeps
               *     the motor neutralised with the steering rail off. */
          ''')
          replace_once('Core/Src/test_steering_centering.c',
                       '    s_state = SYS_STATE_DEGRADED;                  /* Centering_Abort set it */\n',
                       '    s_state = SYS_STATE_LIMP_HOME;                 /* Centering_Abort set it */\n')
          replace_once(
              'Core/Src/test_steering_centering.c',
              '''    test_pwm_persists_and_not_neutralized();
                  test_left_stall_causes_reversal();
          ''',
              '''    test_pwm_persists_and_not_neutralized();
                  test_homing_power_diag_local_rail();
                  test_left_stall_causes_reversal();
          ''')

          # Replace the old executable documentation of the broken relay policy.
          Path('Core/Src/test_relay_degraded.c').write_text(r'''/**
           * @file test_relay_degraded.c
           * @brief Regression model for drive-capable relay sequencing.
           */
          #include <stdio.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include "motion_inhibit.h"

          #define SYS_STATE_BOOT      0
          #define SYS_STATE_STANDBY   1
          #define SYS_STATE_ACTIVE    2
          #define SYS_STATE_DEGRADED  3
          #define SYS_STATE_SAFE      4
          #define SYS_STATE_ERROR     5
          #define SYS_STATE_LIMP_HOME 6
          #define GEAR_PARK           0
          #define GEAR_NEUTRAL        2
          #define GEAR_FORWARD        3
          #define RELAY_TRACTION_SETTLE_MS 50U

          typedef enum { RELAY_SEQ_IDLE = 0, RELAY_SEQ_TRACTION_ON, RELAY_SEQ_COMPLETE } RelaySeqState_t;
          static RelaySeqState_t seq;
          static int state, trac_relay, steer_relay;
          static bool steering_calibrated;
          static uint32_t tick, seq_tick;
          static int tests_run, tests_failed;

          #define CHECK(c, m) do { tests_run++; if (!(c)) { tests_failed++; printf("  FAIL: %s\n", m); } } while (0)

          static bool drive_capable(void) {
              return state == SYS_STATE_ACTIVE || state == SYS_STATE_DEGRADED || state == SYS_STATE_LIMP_HOME;
          }
          static void power_down(void) { trac_relay = steer_relay = 0; seq = RELAY_SEQ_IDLE; }
          static void power_up(void) {
              if (seq != RELAY_SEQ_IDLE) return;
              trac_relay = 1; seq = RELAY_SEQ_TRACTION_ON; seq_tick = tick;
          }
          static void set_state(int s) { state = s; if (drive_capable()) power_up(); }
          static void sequencer_update(void) {
              if (!drive_capable()) { if (seq == RELAY_SEQ_TRACTION_ON) power_down(); return; }
              if (seq == RELAY_SEQ_TRACTION_ON && tick - seq_tick >= RELAY_TRACTION_SETTLE_MS) {
                  steer_relay = steering_calibrated ? 1 : 0;
                  seq = RELAY_SEQ_COMPLETE;
              }
          }
          static bool power_ready(void) { return seq == RELAY_SEQ_COMPLETE; }
          static void reset_world(void) {
              seq = RELAY_SEQ_IDLE; state = SYS_STATE_STANDBY; trac_relay = steer_relay = 0;
              steering_calibrated = false; tick = seq_tick = 0;
          }
          static uint16_t motion_reason(float demand, float effective, uint16_t pwm) {
              MotionInhibitInputs in = {0};
              in.state = (uint8_t)state; in.power_ready = power_ready();
              in.gear = GEAR_FORWARD; in.gear_park = GEAR_PARK; in.gear_neutral = GEAR_NEUTRAL;
              in.state_safe = SYS_STATE_SAFE; in.state_error = SYS_STATE_ERROR;
              in.forward_gear = true; in.demand_pct = demand;
              in.effective_demand_pct = effective; in.final_pwm_max = pwm;
              return MotionInhibit_Evaluate(&in);
          }
          static void complete(void) { tick += RELAY_TRACTION_SETTLE_MS; sequencer_update(); }

          static void test_degraded_from_standby_is_drive_ready(void) {
              reset_world(); set_state(SYS_STATE_DEGRADED); complete();
              CHECK(seq == RELAY_SEQ_COMPLETE, "DEGRADED sequence completes");
              CHECK(trac_relay == 1, "traction relay on");
              CHECK(steer_relay == 0, "uncalibrated steering rail stays off");
              CHECK(power_ready(), "DEGRADED traction power ready");
              uint16_t r = motion_reason(40.0f, 20.0f, 800U);
              CHECK((r & MOTION_INHIBIT_POWER_NOT_READY) == 0, "no POWER_NOT_READY");
              CHECK((r & MOTION_INHIBIT_DEMAND_ZEROED) == 0, "demand not zeroed");
          }
          static void test_limp_from_standby_is_drive_ready(void) {
              reset_world(); set_state(SYS_STATE_LIMP_HOME); complete();
              CHECK(seq == RELAY_SEQ_COMPLETE, "LIMP_HOME sequence completes");
              CHECK(trac_relay == 1, "LIMP traction relay on");
              CHECK(steer_relay == 0, "LIMP uncalibrated steering off/free");
              CHECK(power_ready(), "LIMP traction power ready");
          }
          static void test_active_calibrated_powers_both(void) {
              reset_world(); steering_calibrated = true; set_state(SYS_STATE_ACTIVE); complete();
              CHECK(power_ready(), "ACTIVE power ready");
              CHECK(trac_relay == 1 && steer_relay == 1, "calibrated ACTIVE powers both rails");
          }
          static void test_safe_mid_sequence_powers_down(void) {
              reset_world(); set_state(SYS_STATE_LIMP_HOME);
              state = SYS_STATE_SAFE; sequencer_update();
              CHECK(seq == RELAY_SEQ_IDLE, "SAFE cancels partial sequence");
              CHECK(trac_relay == 0 && steer_relay == 0, "SAFE rails off");
          }
          int main(void) {
              test_degraded_from_standby_is_drive_ready();
              test_limp_from_standby_is_drive_ready();
              test_active_calibrated_powers_both();
              test_safe_mid_sequence_powers_down();
              printf("relay_degraded: %d run, %d failed\n", tests_run, tests_failed);
              return tests_failed ? 1 : 0;
          }
          ''', encoding='utf-8')

          # HMI cannot know L1/L2/L3 from the current CAN contract; do not lie.
          replace_once('esp32/src/screens/drive_screen.cpp',
                       '        bannerText = "DEGRADED  40%";\n',
                       '        bannerText = "DEGRADED";\n')

          # Public contract: power-ready means traction sequence complete; steering
          # rail is conditional on physical calibration.
          replace_once(
              'Core/Inc/safety_system.h',
              '''/* Returns true only when the relay power-up sequence has completed
               * and both relays (TRACTION, STEER_PWR) are physically
               * closed.  Subsystems that depend on relay power being available
               * should gate on this instead of checking system state alone.
               *
               * During the ~70 ms window between entering ACTIVE and relay
               * sequence completion, this returns false.                          */
          ''',
              '''/* Returns true when the traction power-up sequence has completed.
               * TRACTION is always energised in a drive-capable state; STEER_PWR is
               * energised only after physical centering has validated the encoder
               * reference.  Uncalibrated LIMP_HOME therefore remains traction-ready
               * while the steering bridge stays electrically released.             */
          ''')

          print('Applied PR429 safety corrections successfully.')
          PY

      - name: Install validation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cppcheck flawfinder clang-tools
          python3 -m pip install --user lizard==1.17.10 platformio
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run all STM32 host regression tests
        run: |
          set -euo pipefail
          for src in \
            Core/Src/test_motor_control.c \
            Core/Src/test_math_safety.c \
            Core/Src/test_error_log.c \
            Core/Src/test_service_mode.c \
            Core/Src/test_eps_params.c \
            Core/Src/test_sensor_calibration.c \
            Core/Src/test_wheel_speed.c \
            Core/Src/test_wheel_fault_gate.c \
            Core/Src/test_obstacle_fault_state.c \
            Core/Src/test_wheel_diag_can.c \
            Core/Src/test_gear_limits.c \
            Core/Src/test_drive_tuning.c \
            Core/Src/test_battery_limits.c \
            Core/Src/test_steering_cal_store.c \
            Core/Src/test_steering_z.c \
            Core/Src/test_steering_centering.c \
            Core/Src/test_steering_centering_diag.c \
            Core/Src/test_steering_centering_frame.c \
            Core/Src/test_pedal_cal_limits.c \
            Core/Src/test_pedal_cal_session.c \
            Core/Src/test_pedalcal_can_frame.c \
            Core/Src/test_pedalcal_query_readonly.c \
            Core/Src/test_pedal_plausibility.c \
            Core/Src/test_busoff_recovery.c \
            Core/Src/test_motion_inhibit.c \
            Core/Src/test_relay_degraded.c \
            Core/Src/test_relay_health_diag.c \
            Core/Src/test_relay_health_frame.c \
            Core/Src/test_ina226_channel_diag.c \
            Core/Src/test_ina226_ch5_frame.c \
            Core/Src/test_loop_diag.c; do
            exe="/tmp/$(basename "$src" .c)"
            extra=""
            case "$src" in
              Core/Src/test_math_safety.c) extra="Core/Src/math_safety.c" ;;
              Core/Src/test_error_log.c) extra="Core/Src/error_log.c" ;;
              Core/Src/test_service_mode.c) extra="Core/Src/service_mode.c" ;;
              Core/Src/test_eps_params.c) extra="Core/Src/eps_params.c" ;;
              Core/Src/test_loop_diag.c) extra="Core/Src/loop_diag.c" ;;
              Core/Src/test_steering_z.c) extra="Core/Src/steering_z.c" ;;
              Core/Src/test_steering_centering.c) extra="Core/Src/steering_centering.c Core/Src/steering_centering_diag.c" ;;
              Core/Src/test_steering_centering_diag.c) extra="Core/Src/steering_centering_diag.c" ;;
              Core/Src/test_steering_centering_frame.c) extra="Core/Src/steering_centering_diag.c" ;;
              Core/Src/test_pedal_plausibility.c) extra="Core/Src/pedal_logic.c" ;;
              Core/Src/test_pedal_cal_session.c) extra="Core/Src/pedal_cal_session.c" ;;
              Core/Src/test_pedalcal_can_frame.c) extra="Core/Src/pedal_cal_session.c" ;;
              Core/Src/test_pedalcal_query_readonly.c) extra="Core/Src/pedal_cal_session.c" ;;
              Core/Src/test_busoff_recovery.c) extra="Core/Src/busoff_recovery.c" ;;
              Core/Src/test_motion_inhibit.c) extra="Core/Src/motion_inhibit.c" ;;
              Core/Src/test_relay_degraded.c) extra="Core/Src/motion_inhibit.c" ;;
              Core/Src/test_relay_health_diag.c) extra="Core/Src/relay_health_diag.c" ;;
              Core/Src/test_relay_health_frame.c) extra="Core/Src/relay_health_diag.c" ;;
              Core/Src/test_ina226_channel_diag.c) extra="Core/Src/ina226_channel_diag.c" ;;
              Core/Src/test_ina226_ch5_frame.c) extra="Core/Src/ina226_channel_diag.c" ;;
            esac
            echo "-- $(basename "$src")"
            gcc -std=c11 -DHOST_TEST -D_GNU_SOURCE \
              -Ianalysis_artifacts/stubs -ICore/Inc -O2 \
              "$src" $extra -lm -o "$exe"
            "$exe"
          done

