name: Generate OEM Audio Pack (ElevenLabs)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python dependencies
        run: |
          pip install -r tools/audio_pack/requirements.txt

      - name: Generate audio pack
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_PROVIDER: elevenlabs
        working-directory: tools/audio_pack
        run: |
          python3 generar_pack_oem.py --provider elevenlabs --only 69 70 71 72 73 74 75 76 77 78 79 80 81 82 83 84 85 86 87 88 89 90 --no-cache

      - name: Upload audio pack as artifact
        uses: actions/upload-artifact@v6
        with:
          name: audios-0069-0090-elevenlabs
          path: tools/audio_pack/output_sd/
          retention-days: 30

      - name: Summary
        run: |
          echo "## 🎵 Audio Pack Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Provider: **elevenlabs**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Files generated:" >> $GITHUB_STEP_SUMMARY
          ls -la tools/audio_pack/output_sd/ | tail -n +2 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Total tracks: $(ls tools/audio_pack/output_sd/*.mp3 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
