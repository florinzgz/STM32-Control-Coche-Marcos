name: PR436 Export Wheel Scale Cycle Reset

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr436-apply-wheel-scale-reset.yml'

permissions:
  contents: read

jobs:
  export-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/steering-homing-battery-traction
          persist-credentials: false

      - name: Apply explicit per-cycle ABS/TCS baseline reset
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'Core/Inc/safety_system.h',
              'void Safety_Init(void);\nvoid ABS_Update(void);',
              'void Safety_Init(void);\n'
              '/* Rebuild the per-wheel ABS/TCS authority baseline once at the start\n'
              ' * of each 100 Hz control cycle, before ABS_Update() and TCS_Update(). */\n'
              'void Safety_ResetWheelInterventionScales(void);\n'
              'void ABS_Update(void);'
          )

          replace_once(
              'Core/Src/safety_system_patched.c',
              '/* ABS owns the start-of-cycle baseline because main.c always calls ABS_Update()\n'
              ' * immediately before TCS_Update().  Rebuild all four permissions from 1.0 every\n'
              ' * 10 ms, then let ABS and TCS apply only their CURRENT reductions.  The motor\n'
              ' * controller reapplies independent temperature/current cutoffs later in the\n'
              ' * same cycle, so no real hardware protection is weakened. */\n'
              'static void PR_ResetWheelInterventionScales(void)',
              '/* The scheduler owns the start-of-cycle baseline and calls this once after\n'
              ' * Wheel_UpdateSpeeds() and before ABS/TCS.  ABS also invokes it defensively so\n'
              ' * direct test or diagnostic calls cannot inherit a stale historical reduction.\n'
              ' * Temperature/current cutoffs are reapplied independently by Traction_Update(). */\n'
              'void Safety_ResetWheelInterventionScales(void)'
          )

          replace_once(
              'Core/Src/safety_system_patched.c',
              '    PR_ResetWheelInterventionScales();',
              '    Safety_ResetWheelInterventionScales();'
          )

          replace_once(
              'Core/Src/main.c',
              '            Wheel_UpdateSpeeds();\n\n            ABS_Update();\n            TCS_Update();',
              '            Wheel_UpdateSpeeds();\n\n'
              '            /* Start every ABS/TCS arbitration cycle from full per-wheel\n'
              '             * authority.  ABS and tuned TCS may only lower the current\n'
              '             * cycle values; no historical reduction can remain latched. */\n'
              '            Safety_ResetWheelInterventionScales();\n'
              '            ABS_Update();\n'
              '            TCS_Update();'
          )

          replace_once(
              '.github/workflows/pr436-field-fixes.yml',
              "      - 'Core/Src/safety_system_patched.c'\n      - 'Core/Inc/traction_output_policy.h'",
              "      - 'Core/Src/safety_system_patched.c'\n      - 'Core/Inc/safety_system.h'\n      - 'Core/Inc/traction_output_policy.h'"
          )

          replace_once(
              '.github/workflows/pr436-field-fixes.yml',
              "          cycle = main.index('Wheel_UpdateSpeeds();')\n"
              "          abs_call = main.index('ABS_Update();', cycle)\n"
              "          tcs_call = main.index('TCS_Update();', abs_call)\n"
              "          traction_call = main.index('Traction_Update();', tcs_call)\n"
              "          assert cycle < abs_call < tcs_call < traction_call\n\n"
              "          safety = open('Core/Src/safety_system_patched.c', encoding='utf-8').read()\n"
              "          abs_fn = safety.index('void ABS_Update(void)')\n"
              "          reset_call = safety.index('PR_ResetWheelInterventionScales();', abs_fn)\n"
              "          abs_gate = safety.index('if (!ServiceMode_IsEnabled(MODULE_ABS)', abs_fn)\n"
              "          assert abs_fn < reset_call < abs_gate",
              "          cycle = main.index('Wheel_UpdateSpeeds();')\n"
              "          reset_call = main.index('Safety_ResetWheelInterventionScales();', cycle)\n"
              "          abs_call = main.index('ABS_Update();', reset_call)\n"
              "          tcs_call = main.index('TCS_Update();', abs_call)\n"
              "          traction_call = main.index('Traction_Update();', tcs_call)\n"
              "          assert cycle < reset_call < abs_call < tcs_call < traction_call\n\n"
              "          header = open('Core/Inc/safety_system.h', encoding='utf-8').read()\n"
              "          assert 'void Safety_ResetWheelInterventionScales(void);' in header\n\n"
              "          safety = open('Core/Src/safety_system_patched.c', encoding='utf-8').read()\n"
              "          reset_fn = safety.index('void Safety_ResetWheelInterventionScales(void)')\n"
              "          abs_fn = safety.index('void ABS_Update(void)', reset_fn)\n"
              "          defensive_reset = safety.index('Safety_ResetWheelInterventionScales();', abs_fn)\n"
              "          abs_gate = safety.index('if (!ServiceMode_IsEnabled(MODULE_ABS)', abs_fn)\n"
              "          assert reset_fn < abs_fn < defensive_reset < abs_gate"
          )
          PY

          git diff --check
          grep -q 'Safety_ResetWheelInterventionScales();' Core/Src/main.c
          grep -q '^void Safety_ResetWheelInterventionScales(void)$' Core/Src/safety_system_patched.c
          grep -q '^void Safety_ResetWheelInterventionScales(void);$' Core/Inc/safety_system.h

      - name: Stage corrected files
        run: |
          set -euo pipefail
          mkdir -p exported/Core/Inc exported/Core/Src exported/.github/workflows
          cp Core/Inc/safety_system.h exported/Core/Inc/
          cp Core/Src/safety_system_patched.c exported/Core/Src/
          cp Core/Src/main.c exported/Core/Src/
          cp .github/workflows/pr436-field-fixes.yml exported/.github/workflows/
          git diff -- Core/Inc/safety_system.h Core/Src/safety_system_patched.c Core/Src/main.c .github/workflows/pr436-field-fixes.yml > exported/wheel-scale-cycle-reset.patch

      - name: Upload corrected sources
        uses: actions/upload-artifact@v4
        with:
          name: pr436-wheel-scale-cycle-reset-sources
          path: exported/
          if-no-files-found: error
