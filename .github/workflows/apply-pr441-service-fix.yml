name: Apply PR441 service calibration fix

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-pr441-service-fix.yml'
  push:
    branches:
      - fix/disable-rc-bench

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.number == 441)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/disable-rc-bench
          fetch-depth: 0

      - name: Assemble and structurally verify patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/pr441-service.patch
          for part in .github/pr441_patch/part*.b64; do
            base64 --ignore-garbage --decode "$part" >> /tmp/pr441-service.patch
          done
          sha256sum /tmp/pr441-service.patch
          git apply --3way --check /tmp/pr441-service.patch
          git apply --3way /tmp/pr441-service.patch
          git diff --check

      - name: Run focused safety tests
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -DHOST_TEST \
            -ICore/Inc Core/Src/test_pedal_cal_session.c \
            Core/Src/pedal_cal_session.c -lm \
            -o /tmp/test_pedal_cal_session
          /tmp/test_pedal_cal_session

          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iesp32/src -Iesp32/test_stubs \
            esp32/src/traction_switch.cpp esp32/src/test_mode_sync.cpp \
            -o /tmp/test_mode_sync
          /tmp/test_mode_sync

          gcc -std=c11 -Wall -Wextra -Werror \
            -DHOST_TEST -DHOST_TEST_GPIO_MODEL -D_GNU_SOURCE \
            -Ianalysis_artifacts/stubs -ICore/Inc -O2 \
            Core/Src/test_relay_seq_eps.c \
            Core/Src/safety_system_patched.c \
            Core/Src/steering_eps.c Core/Src/math_safety.c -lm \
            -o /tmp/test_relay_seq_eps
          /tmp/test_relay_seq_eps

          python3 scripts/check_effective_eps_wrapper.py

      - name: Commit productive files only
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/sensor-eps-regression.yml
          rm -rf .github/pr441_patch
          rm -f .github/workflows/apply-pr441-service-fix.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix service calibration, degraded recovery and local controls'
          git push origin HEAD:fix/disable-rc-bench
