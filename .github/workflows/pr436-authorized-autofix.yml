name: PR436 Authorized Audit Fix

on:
  push:
    branches:
      - fix/steering-homing-battery-traction

permissions:
  contents: write

jobs:
  apply-authorized-fixes:
    if: github.event.head_commit.message == 'chore: stage authorized PR436 audit fixes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply audited safety fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding="utf-8")

          def replace(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} matches, found {count}\n--- needle ---\n{old}")
              write(path, text.replace(old, new))

          # -----------------------------------------------------------------
          # Pure physical-output policy: shared by production and host tests.
          # -----------------------------------------------------------------
          write("Core/Inc/traction_output_policy.h", r'''#ifndef TRACTION_OUTPUT_POLICY_H
          #define TRACTION_OUTPUT_POLICY_H

          #include <stdbool.h>
          #include <stdint.h>

          #define TRACTION_OUTPUT_WHEEL_COUNT 4U

          static inline uint16_t TractionOutput_ClampPwm(uint32_t pwm,
                                                         uint16_t pwm_max)
          {
              return (pwm > pwm_max) ? pwm_max : (uint16_t)pwm;
          }

          /* Reduction-only cap.  NaN and non-positive scale fail closed to zero. */
          static inline uint16_t TractionOutput_CapPwmByScale(uint16_t pwm,
                                                              float scale,
                                                              uint16_t pwm_max)
          {
              pwm = TractionOutput_ClampPwm(pwm, pwm_max);
              if (!(scale > 0.0f)) return 0U;
              if (scale >= 1.0f) return pwm;
              return (uint16_t)((float)pwm * scale);
          }

          /* Equalisation must never raise a wheel above its resolved safe output. */
          static inline uint16_t TractionOutput_MinPwm(const uint16_t pwm[4])
          {
              uint16_t result = pwm[0];
              for (uint8_t i = 1U; i < TRACTION_OUTPUT_WHEEL_COUNT; ++i) {
                  if (pwm[i] < result) result = pwm[i];
              }
              return result;
          }

          static inline bool TractionOutput_SameNonzeroDirection(const int8_t dir[4])
          {
              if (dir[0] == 0) return false;
              for (uint8_t i = 1U; i < TRACTION_OUTPUT_WHEEL_COUNT; ++i) {
                  if (dir[i] != dir[0]) return false;
              }
              return true;
          }

          #endif /* TRACTION_OUTPUT_POLICY_H */
          ''')

          write("Core/Src/test_traction_output_policy.c", r'''#ifdef HOST_TEST
          #include <stdio.h>
          #include "traction_output_policy.h"

          static int run_count;
          static int fail_count;

          #define CHECK(expr) do { \
              ++run_count; \
              if (!(expr)) { \
                  ++fail_count; \
                  printf("FAIL %s:%d: %s\n", __FILE__, __LINE__, #expr); \
              } \
          } while (0)

          int main(void)
          {
              const uint16_t unequal[4] = {1200U, 1000U, 900U, 1100U};
              const int8_t same_dir[4] = {1, 1, 1, 1};
              const int8_t mixed_dir[4] = {1, 1, -1, 1};

              CHECK(TractionOutput_MinPwm(unequal) == 900U);
              CHECK(TractionOutput_SameNonzeroDirection(same_dir));
              CHECK(!TractionOutput_SameNonzeroDirection(mixed_dir));
              CHECK(TractionOutput_CapPwmByScale(1000U, 0.0f, 4249U) == 0U);
              CHECK(TractionOutput_CapPwmByScale(1000U, 0.5f, 4249U) == 500U);
              CHECK(TractionOutput_CapPwmByScale(5000U, 1.0f, 4249U) == 4249U);

              printf("test_traction_output_policy: %d run, %d failed\n",
                     run_count, fail_count);
              return fail_count == 0 ? 0 : 1;
          }
          #endif
          ''')

          # -----------------------------------------------------------------
          # Traction wrapper: preserve real shadow PWM/ramp, rear safety caps,
          # and make straight-line equalisation reduction-only.
          # -----------------------------------------------------------------
          replace("Core/Src/motor_control_patched.c",
                  '#include "steering_centering.h"\n',
                  '#include "steering_centering.h"\n#include "traction_output_policy.h"\n')

          replace("Core/Src/motor_control_patched.c", r'''    return m;
          }

          static bool drive_state(SystemState_t state)
          ''', r'''    return m;
          }

          /* Read the duty actually resolved into the shadow timer registers.
           * Unlike the legacy wheel telemetry, this remains truthful during the
           * bounded Neutral ramp and therefore becomes the source routed to the
           * real BTS7960 outputs. */
          static uint16_t shadow_resolved_pwm(const Motor_t *motor)
          {
              const uint32_t rpwm = __HAL_TIM_GET_COMPARE(motor->rpwm_timer,
                                                          motor->rpwm_channel);
              const uint32_t lpwm = __HAL_TIM_GET_COMPARE(motor->lpwm_timer,
                                                          motor->lpwm_channel);
              const uint32_t resolved = (rpwm > lpwm) ? rpwm : lpwm;
              return TractionOutput_ClampPwm(resolved, PWM_PERIOD);
          }

          static bool drive_state(SystemState_t state)
          ''')

          replace("Core/Src/motor_control_patched.c",
                  '        if (safety_status.wheel_scale[i] < 0.999f) return false;\n',
                  '        if (safety_status.wheel_scale[i] < (1.0f - 1.0e-6f)) return false;\n')

          replace("Core/Src/motor_control_patched.c", r'''    uint16_t pwm[4] = {
              traction_state.wheels[MOTOR_FL].pwm,
              traction_state.wheels[MOTOR_FR].pwm,
              traction_state.wheels[MOTOR_RL].pwm,
              traction_state.wheels[MOTOR_RR].pwm
          };
          ''', r'''    /* Capture the effective shadow hardware, not the legacy telemetry.
           * This preserves Neutral's bounded ramp and any per-cycle jerk limit. */
          uint16_t pwm[4] = {
              shadow_resolved_pwm(&motor_fl),
              shadow_resolved_pwm(&motor_fr),
              shadow_resolved_pwm(&motor_rl),
              shadow_resolved_pwm(&motor_rr)
          };
          ''')

          replace("Core/Src/motor_control_patched.c", r'''        const bool all_drive = mode[0] == MOTOR_MODE_DRIVE &&
                                         mode[1] == MOTOR_MODE_DRIVE &&
                                         mode[2] == MOTOR_MODE_DRIVE &&
                                         mode[3] == MOTOR_MODE_DRIVE;
                  if (all_drive && straight_line_unlimited()) {
                      uint16_t equal_pwm = pwm[0];
                      for (uint8_t i = 1U; i < 4U; ++i) {
                          if (pwm[i] > equal_pwm) equal_pwm = pwm[i];
                      }
                      int8_t equal_dir = direction[MOTOR_FL] < 0 ? -1 : 1;
          ''', r'''        const bool all_drive = mode[0] == MOTOR_MODE_DRIVE &&
                                         mode[1] == MOTOR_MODE_DRIVE &&
                                         mode[2] == MOTOR_MODE_DRIVE &&
                                         mode[3] == MOTOR_MODE_DRIVE;
                  const bool same_direction =
                      TractionOutput_SameNonzeroDirection(direction);
                  if (all_drive && same_direction && straight_line_unlimited()) {
                      /* Use the MINIMUM resolved duty: symmetry may reduce stronger
                       * channels, but can never raise a wheel over its jerk/safety cap. */
                      const uint16_t equal_pwm = TractionOutput_MinPwm(pwm);
                      const int8_t equal_dir = direction[MOTOR_FL] < 0 ? -1 : 1;
          ''')

          replace("Core/Src/motor_control_patched.c", r'''        if (mode[MOTOR_FL] == MOTOR_MODE_BRAKE &&
                      mode[MOTOR_FR] == MOTOR_MODE_BRAKE) {
                      brake_all();
                      zero_output_telemetry();
                      return;
                  }
          ''', r'''        if (mode[MOTOR_FL] == MOTOR_MODE_BRAKE &&
                      mode[MOTOR_FR] == MOTOR_MODE_BRAKE) {
                      /* Logical FL/FR are the installed rear axle in 4x2.  Brake
                       * RL/RR only and keep the non-driven front axle in coast. */
                      Motor_SetMode(&motor_fl, MOTOR_MODE_COAST, 0);
                      Motor_SetMode(&motor_fr, MOTOR_MODE_COAST, 0);
                      Motor_SetMode(&motor_rl, MOTOR_MODE_BRAKE, 0);
                      Motor_SetMode(&motor_rr, MOTOR_MODE_BRAKE, 0);
                      zero_output_telemetry();
                      return;
                  }
          ''')

          replace("Core/Src/motor_control_patched.c", r'''        apply_motor(&motor_rl, MOTOR_RL, mode[MOTOR_FL], pwm[MOTOR_FL], direction[MOTOR_FL]);
                  apply_motor(&motor_rr, MOTOR_RR, mode[MOTOR_FR], pwm[MOTOR_FR], direction[MOTOR_FR]);
          ''', r'''        /* The base 4x2 decision is logical-left/logical-right.  Apply
                   * the PHYSICAL rear-wheel safety caps again at the final routing
                   * boundary so RL/RR temperature/TCS/ABS cutoffs can never be
                   * bypassed by the FL/FR shadow calculation. */
                  const uint16_t rear_left_pwm = TractionOutput_CapPwmByScale(
                      pwm[MOTOR_FL], safety_status.wheel_scale[MOTOR_RL], PWM_PERIOD);
                  const uint16_t rear_right_pwm = TractionOutput_CapPwmByScale(
                      pwm[MOTOR_FR], safety_status.wheel_scale[MOTOR_RR], PWM_PERIOD);
                  apply_motor(&motor_rl, MOTOR_RL, mode[MOTOR_FL], rear_left_pwm,
                              direction[MOTOR_FL]);
                  apply_motor(&motor_rr, MOTOR_RR, mode[MOTOR_FR], rear_right_pwm,
                              direction[MOTOR_FR]);
          ''')

          # -----------------------------------------------------------------
          # Steering homing: two fresh stationary pressure samples, never
          # complete PB5 with a faulted encoder, truthful dead-time telemetry.
          # -----------------------------------------------------------------
          replace("Core/Src/steering_centering_patched.c",
                  '#define ENDSTOP_ENCODER_DELTA_COUNTS     2\n',
                  '#define ENDSTOP_ENCODER_DELTA_COUNTS     2\n#define ENDSTOP_CONFIRM_SAMPLES           2U\n')
          replace("Core/Src/steering_centering_patched.c", r'''    uint32_t last_sample_sequence;
              bool reverse_pending;
          ''', r'''    uint32_t last_sample_sequence;
              uint8_t pressure_confirm_samples;
              bool reverse_pending;
          ''')
          replace("Core/Src/steering_centering_patched.c",
                  '    s_guard.last_sample_sequence = 0U;\n}\n\nstatic void reset_guard',
                  '    s_guard.last_sample_sequence = 0U;\n    s_guard.pressure_confirm_samples = 0U;\n}\n\nstatic void reset_guard')
          replace("Core/Src/steering_centering_patched.c",
                  '    s_guard.last_sample_sequence = 0U;\n    s_guard.reverse_pending = false;',
                  '    s_guard.last_sample_sequence = 0U;\n    s_guard.pressure_confirm_samples = 0U;\n    s_guard.reverse_pending = false;')
          replace("Core/Src/steering_centering_patched.c", r'''        s_guard.reference_count = count;
                  s_guard.last_motion_ms = now;
              }

              const Ina226ChannelDiag *diag = Sensor_GetChannel5Diag();
          ''', r'''        s_guard.reference_count = count;
                  s_guard.last_motion_ms = now;
                  s_guard.pressure_confirm_samples = 0U;
              }

              const Ina226ChannelDiag *diag = Sensor_GetChannel5Diag();
          ''')
          replace("Core/Src/steering_centering_patched.c", r'''    if (diag == NULL || !diag->i2c_ack || !diag->shunt_read_ok ||
                  diag->sample_age_ms > ENDSTOP_SAMPLE_MAX_AGE_MS ||
                  diag->sample_sequence == s_guard.last_sample_sequence) {
                  return false;
              }
          ''', r'''    if (diag == NULL || !diag->i2c_ack || !diag->shunt_read_ok ||
                  diag->sample_age_ms > ENDSTOP_SAMPLE_MAX_AGE_MS) {
                  s_guard.pressure_confirm_samples = 0U;
                  return false;
              }
              if (diag->sample_sequence == s_guard.last_sample_sequence) {
                  return false;
              }
          ''')
          replace("Core/Src/steering_centering_patched.c", r'''    return current >= ENDSTOP_HARD_CURRENT_MA ||
                     (no_motion && current >= ENDSTOP_STALL_CURRENT_MA);
          ''', r'''    /* Never classify a moving high-friction point as an end stop.
               * Require stationary encoder evidence plus two genuinely fresh CH5
               * samples, including at the hard-current threshold. */
              const bool pressure = no_motion &&
                  (current >= ENDSTOP_STALL_CURRENT_MA);
              if (!pressure) {
                  s_guard.pressure_confirm_samples = 0U;
                  return false;
              }
              if (s_guard.pressure_confirm_samples < ENDSTOP_CONFIRM_SAMPLES) {
                  s_guard.pressure_confirm_samples++;
              }
              if (s_guard.pressure_confirm_samples < ENDSTOP_CONFIRM_SAMPLES) {
                  return false;
              }
              s_guard.pressure_confirm_samples = 0U;
              return true;
          ''')
          replace("Core/Src/steering_centering_patched.c",
                  '    s_guard.reverse_pending = true;\n',
                  '    s_guard.pressure_confirm_samples = 0U;\n    s_guard.reverse_pending = true;\n')
          replace("Core/Src/steering_centering_patched.c", r'''    if (centering_state != CENTERING_DONE ||
                  !Steering_IsCalibrated() || Steering_IsAssistLatchedOff()) {
          ''', r'''    if (centering_state != CENTERING_DONE || Encoder_HasFault() ||
                  !Steering_IsCalibrated() || Steering_IsAssistLatchedOff()) {
          ''')
          replace("Core/Src/steering_centering_patched.c", r'''    if (centering_state != CENTERING_DONE &&
                  centering_state != CENTERING_FAULT && center_raw_stable()) {
          ''', r'''    if (centering_state != CENTERING_DONE &&
                  centering_state != CENTERING_FAULT && !Encoder_HasFault() &&
                  center_raw_stable()) {
          ''')
          replace("Core/Src/steering_centering_patched.c", r'''    if (is_sweep(centering_state)) {
                  s_diag.pwm_requested = HOMING_PWM_COUNTS;
              }
          ''', r'''    if (s_guard.reverse_pending) {
                  s_diag.pwm_requested = 0U;
              } else if (is_sweep(centering_state)) {
                  s_diag.pwm_requested = HOMING_PWM_COUNTS;
              }
          ''')

          # -----------------------------------------------------------------
          # EPS supervisor: post-isolation samples are accepted only when the
          # overcurrent FSM itself is awaiting confirmation.
          # -----------------------------------------------------------------
          replace("Core/Inc/steering_supervisor.h", r'''/** @brief  Current overcurrent FSM state (diagnostics/tests). */
          OcState_t SteeringSupervisor_OcState(void);
          ''', r'''/** @brief  Current overcurrent FSM state (diagnostics/tests). */
          OcState_t SteeringSupervisor_OcState(void);

          /** @brief true only while the OC FSM needs a fresh post-isolation CH5
           *         sample.  Unrelated EPS latches must not start an OC sequence. */
          bool SteeringSupervisor_NeedsPostIsolationSample(void);
          ''')
          replace("Core/Src/steering_supervisor.c", r'''bool SteeringSupervisor_WantsSafe(void)      { return s_want_safe; }
          EpsFaultReason_t SteeringSupervisor_LastCause(void) { return s_last_cause; }
          OcState_t SteeringSupervisor_OcState(void)   { return s_oc.state; }
          ''', r'''bool SteeringSupervisor_WantsSafe(void)      { return s_want_safe; }
          EpsFaultReason_t SteeringSupervisor_LastCause(void) { return s_last_cause; }
          OcState_t SteeringSupervisor_OcState(void)   { return s_oc.state; }
          bool SteeringSupervisor_NeedsPostIsolationSample(void)
          {
              return s_oc.state == OC_STATE_CONFIRM_WAIT ||
                     s_oc.state == OC_STATE_ISOLATED_UNCONFIRMED;
          }
          ''')
          replace("Core/Src/steering_supervisor_io.c", r'''        const bool eps_drive_active = steering_output_is_actively_driven(ch5);
                  const bool homing_active = steering_homing_is_active(centering);
          ''', r'''        const bool eps_drive_active = steering_output_is_actively_driven(ch5);
                  const bool homing_active = steering_homing_is_active(centering);
                  const bool oc_confirmation =
                      SteeringSupervisor_NeedsPostIsolationSample();
          ''')
          replace("Core/Src/steering_supervisor_io.c", r'''        in.ch5_sample_valid = raw_sample_valid && !homing_active &&
                      (eps_drive_active || Steering_IsAssistLatchedOff());
          ''', r'''        in.ch5_sample_valid = raw_sample_valid && !homing_active &&
                      (eps_drive_active || oc_confirmation);
          ''')

          # -----------------------------------------------------------------
          # Battery single-source validation and stationary service predicate.
          # -----------------------------------------------------------------
          replace("Core/Inc/battery_limits_store.h", r'''typedef struct {
              uint16_t warning_cv;    /* low-voltage warning point */
              uint16_t limit_cv;      /* derate (DEGRADED) threshold */
              uint16_t cutoff_cv;     /* SAFE cutoff threshold */
              uint16_t recovery_cv;   /* SAFE -> STANDBY recovery threshold */
              uint16_t filter_ms;     /* EMA/debounce time constant (0 = off) */
          } BatteryLimits_t;
          ''', r'''typedef struct {
              uint16_t warning_cv;    /* low-voltage warning point */
              uint16_t limit_cv;      /* derate (DEGRADED) threshold */
              uint16_t cutoff_cv;     /* SAFE cutoff threshold */
              uint16_t recovery_cv;   /* SAFE -> STANDBY recovery threshold */
              uint16_t filter_ms;     /* EMA/debounce time constant (0 = off) */
          } BatteryLimits_t;

          /* HAL-free single source used by production and host tests. */
          static inline bool BatteryLimits_ValidateValues(const BatteryLimits_t *b)
          {
              if (!b) return false;
              if (b->warning_cv  < BATT_WARNING_MIN_CV  || b->warning_cv  > BATT_WARNING_MAX_CV)  return false;
              if (b->limit_cv    < BATT_LIMIT_MIN_CV    || b->limit_cv    > BATT_LIMIT_MAX_CV)    return false;
              if (b->cutoff_cv   < BATT_CUTOFF_MIN_CV   || b->cutoff_cv   > BATT_CUTOFF_MAX_CV)   return false;
              if (b->recovery_cv < BATT_RECOVERY_MIN_CV || b->recovery_cv > BATT_RECOVERY_MAX_CV) return false;
          #if (BATT_FILTER_MIN_MS > 0U)
              if (b->filter_ms < BATT_FILTER_MIN_MS) return false;
          #endif
              if (b->filter_ms > BATT_FILTER_MAX_MS) return false;
              if (b->warning_cv  <= b->cutoff_cv) return false;
              if (b->limit_cv    <= b->cutoff_cv) return false;
              if (b->recovery_cv <= b->cutoff_cv) return false;
              if (b->warning_cv  > BATT_OV_WARNING_CV) return false;
              if (b->limit_cv    > BATT_OV_WARNING_CV) return false;
              return true;
          }
          ''')
          replace("Core/Inc/battery_limits_store.h", r'''bool BatteryLimitsStore_Validate(const BatteryLimits_t *b);
          ''', r'''bool BatteryLimitsStore_Validate(const BatteryLimits_t *b);

          /** Shared CAN/store gate.  True in STANDBY or in the narrowly verified
           * stationary P/N service condition (UV-warning DEGRADED only). */
          bool BatteryLimitsStore_ServiceWriteAllowed(void);
          ''')
          replace("Core/Src/battery_limits_store.c",
                  '#include <stddef.h>\n',
                  '#include <stddef.h>\n#include <math.h>\n')
          replace("Core/Src/battery_limits_store.c",
                  'static bool batt_stationary_service_write_safe(void)\n',
                  'bool BatteryLimitsStore_ServiceWriteAllowed(void)\n')
          replace("Core/Src/battery_limits_store.c", r'''    if (Pedal_GetPercent() >= BATT_SERVICE_PEDAL_MAX_PCT) {
                  return false;
              }

              if (Traction_GetFinalPwmPct() != 0U) {
                  return false;
              }

              if (Wheel_GetSpeed_FL() > BATT_SERVICE_SPEED_MAX_KMH ||
                  Wheel_GetSpeed_FR() > BATT_SERVICE_SPEED_MAX_KMH ||
                  Wheel_GetSpeed_RL() > BATT_SERVICE_SPEED_MAX_KMH ||
                  Wheel_GetSpeed_RR() > BATT_SERVICE_SPEED_MAX_KMH) {
                  return false;
              }
          ''', r'''    const float pedal = Pedal_GetPercent();
              if (!isfinite(pedal) || pedal >= BATT_SERVICE_PEDAL_MAX_PCT) {
                  return false;
              }

              /* motor_control_patched publishes the resolved REAL shadow duty,
               * including Neutral's ramp.  Any non-zero output blocks flash. */
              if (Traction_GetFinalPwmPct() != 0U) {
                  return false;
              }

              const float speeds[4] = {
                  Wheel_GetSpeed_FL(), Wheel_GetSpeed_FR(),
                  Wheel_GetSpeed_RL(), Wheel_GetSpeed_RR()
              };
              for (uint8_t i = 0U; i < 4U; ++i) {
                  if (!isfinite(speeds[i]) ||
                      fabsf(speeds[i]) >= BATT_SERVICE_SPEED_MAX_KMH) {
                      return false;
                  }
              }
          ''')
          replace("Core/Src/battery_limits_store.c", r'''bool BatteryLimitsStore_Validate(const BatteryLimits_t *b)
          {
              if (!b) return false;

              if (b->warning_cv  < BATT_WARNING_MIN_CV  || b->warning_cv  > BATT_WARNING_MAX_CV)  return false;
              if (b->limit_cv    < BATT_LIMIT_MIN_CV    || b->limit_cv    > BATT_LIMIT_MAX_CV)    return false;
              if (b->cutoff_cv   < BATT_CUTOFF_MIN_CV   || b->cutoff_cv   > BATT_CUTOFF_MAX_CV)   return false;
              if (b->recovery_cv < BATT_RECOVERY_MIN_CV || b->recovery_cv > BATT_RECOVERY_MAX_CV) return false;
          #if (BATT_FILTER_MIN_MS > 0U)
              if (b->filter_ms   < BATT_FILTER_MIN_MS) return false;
          #endif
              if (b->filter_ms   > BATT_FILTER_MAX_MS) return false;

              if (b->warning_cv  <= b->cutoff_cv) return false;
              if (b->limit_cv    <= b->cutoff_cv) return false;
              if (b->recovery_cv <= b->cutoff_cv) return false;
              if (b->warning_cv  > BATT_OV_WARNING_CV) return false;
              if (b->limit_cv    > BATT_OV_WARNING_CV) return false;
              return true;
          }
          ''', r'''bool BatteryLimitsStore_Validate(const BatteryLimits_t *b)
          {
              return BatteryLimits_ValidateValues(b);
          }
          ''')
          replace("Core/Src/battery_limits_store.c",
                  '    if (!batt_stationary_service_write_safe())\n',
                  '    if (!BatteryLimitsStore_ServiceWriteAllowed())\n')

          # CAN must use the same service predicate instead of pre-rejecting
          # ACTIVE/UV-DEGRADED before the store can verify stationary hardware.
          replace("Core/Src/can_handler.c", r'''static inline bool battlim_safety_ok(void)
          {
              return (Safety_GetState() == SYS_STATE_STANDBY);
          }
          ''', r'''static inline bool battlim_safety_ok(void)
          {
              return BatteryLimitsStore_ServiceWriteAllowed();
          }
          ''')

          # Critical UV is evaluated on the valid RAW sample; filtering remains
          # for warning, derate and stable recovery only.
          replace("Core/Src/safety_system.c", r'''    /* ---- Optional voltage filter (FASE 3) ----
          ''', r'''    /* A valid raw sample below the critical cutoff is an immediate
               * electrical protection event.  Never let the optional EMA delay SAFE;
               * the filter is only for non-critical bands and stable recovery. */
              const float uv_cutoff_v = batt_cv_to_v(batt_limits.cutoff_cv);
              if (raw_voltage < uv_cutoff_v) {
                  Safety_SetError(SAFETY_ERROR_BATTERY_UV_CRITICAL);
                  Safety_SetState(SYS_STATE_SAFE);
                  batt_uv_recovery_pending = 0;
                  batt_v_filt_init = false;
                  return;
              }

              /* ---- Optional voltage filter (FASE 3) ----
          ''')
          replace("Core/Src/safety_system.c", r'''    const float uv_cutoff_v   = batt_cv_to_v(batt_limits.cutoff_cv);
              const float uv_recovery_v = batt_cv_to_v(batt_limits.recovery_cv);
          ''', r'''    const float uv_recovery_v = batt_cv_to_v(batt_limits.recovery_cv);
          ''')

          # ESP32 fallback/editor defaults must match the STM32 profile.
          replace("esp32/include/can_ids.h", r'''inline constexpr uint16_t BATT_WARNING_DEFAULT_CV  = 2000;
          inline constexpr uint16_t BATT_LIMIT_DEFAULT_CV    = 2000;
          inline constexpr uint16_t BATT_CUTOFF_DEFAULT_CV   = 1800;
          inline constexpr uint16_t BATT_RECOVERY_DEFAULT_CV = 1850;
          inline constexpr uint16_t BATT_FILTER_DEFAULT_MS   = 0;
          ''', r'''inline constexpr uint16_t BATT_WARNING_DEFAULT_CV  = 1800;
          inline constexpr uint16_t BATT_LIMIT_DEFAULT_CV    = 1700;
          inline constexpr uint16_t BATT_CUTOFF_DEFAULT_CV   = 1600;
          inline constexpr uint16_t BATT_RECOVERY_DEFAULT_CV = 1700;
          inline constexpr uint16_t BATT_FILTER_DEFAULT_MS   = 500;
          ''')

          # Host test now executes the exact HAL-free production validator.
          replace("Core/Src/test_battery_limits.c", r'''static bool test_validate(const BatteryLimits_t *b)
          {
              if (!b) return false;
              if (b->warning_cv  < BATT_WARNING_MIN_CV  || b->warning_cv  > BATT_WARNING_MAX_CV) return false;
              if (b->limit_cv    < BATT_LIMIT_MIN_CV    || b->limit_cv    > BATT_LIMIT_MAX_CV) return false;
              if (b->cutoff_cv   < BATT_CUTOFF_MIN_CV   || b->cutoff_cv   > BATT_CUTOFF_MAX_CV) return false;
              if (b->recovery_cv < BATT_RECOVERY_MIN_CV || b->recovery_cv > BATT_RECOVERY_MAX_CV) return false;
          #if (BATT_FILTER_MIN_MS > 0U)
              if (b->filter_ms < BATT_FILTER_MIN_MS) return false;
          #endif
              if (b->filter_ms > BATT_FILTER_MAX_MS) return false;
              if (b->warning_cv  <= b->cutoff_cv) return false;
              if (b->limit_cv    <= b->cutoff_cv) return false;
              if (b->recovery_cv <= b->cutoff_cv) return false;
              if (b->warning_cv  > BATT_OV_WARNING_CV) return false;
              if (b->limit_cv    > BATT_OV_WARNING_CV) return false;
              return true;
          }

          ''', '')
          text = read("Core/Src/test_battery_limits.c")
          if "test_validate(" not in text:
              raise RuntimeError("test_battery_limits.c: expected test_validate calls")
          write("Core/Src/test_battery_limits.c",
                text.replace("test_validate(", "BatteryLimits_ValidateValues("))

          # Harden and broaden the targeted workflow; execute policy tests.
          wf = read(".github/workflows/pr436-field-fixes.yml")
          wf = wf.replace("      - 'Core/Src/steering_centering_patched.c'\n",
                          "      - 'Core/Src/steering_centering_patched.c'\n"
                          "      - 'Core/Src/steering_centering.c'\n"
                          "      - 'Core/Src/steering_supervisor.c'\n"
                          "      - 'Core/Inc/steering_supervisor.h'\n")
          wf = wf.replace("      - 'Core/Src/motor_control_patched.c'\n",
                          "      - 'Core/Src/motor_control_patched.c'\n"
                          "      - 'Core/Src/motor_control.c'\n"
                          "      - 'Core/Inc/traction_output_policy.h'\n"
                          "      - 'Core/Src/test_traction_output_policy.c'\n")
          wf = wf.replace("      - 'Core/Src/battery_limits_store.c'\n",
                          "      - 'Core/Src/battery_limits_store.c'\n"
                          "      - 'Core/Src/test_battery_limits.c'\n"
                          "      - 'Core/Src/safety_system.c'\n"
                          "      - 'Core/Src/can_handler.c'\n"
                          "      - 'esp32/include/can_ids.h'\n")
          if wf.count("- uses: actions/checkout@v6\n") != 2:
              raise RuntimeError("unexpected checkout count in pr436 workflow")
          wf = wf.replace("- uses: actions/checkout@v6\n",
                          "- uses: actions/checkout@v6\n"
                          "        with:\n"
                          "          persist-credentials: false\n")
          marker = "          grep -Eq 'BATT_UV_CRIT_RAW = 1600;' esp32/src/ui/ui_config.h\n"
          if marker not in wf:
              raise RuntimeError("workflow contract marker missing")
          wf = wf.replace(marker, marker + r'''

                    gcc -std=c11 -DHOST_TEST -ICore/Inc -O2 \
                      Core/Src/test_battery_limits.c \
                      -o /tmp/test_battery_limits_pr436
                    /tmp/test_battery_limits_pr436

                    gcc -std=c11 -DHOST_TEST -ICore/Inc -O2 \
                      Core/Src/test_traction_output_policy.c \
                      -o /tmp/test_traction_output_policy
                    /tmp/test_traction_output_policy

                    grep -q 'return BatteryLimitsStore_ServiceWriteAllowed();' Core/Src/can_handler.c
                    grep -q 'raw_voltage < uv_cutoff_v' Core/Src/safety_system.c
                    grep -q 'SteeringSupervisor_NeedsPostIsolationSample' Core/Src/steering_supervisor_io.c
          ''')
          write(".github/workflows/pr436-field-fixes.yml", wf)

          # This privileged one-shot workflow must not remain in the branch.
          Path(".github/workflows/pr436-authorized-autofix.yml").unlink()
          PY

          git diff --check
          git status --short

      - name: Commit fixes to the same PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PR436 Authorized Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden PR436 steering traction and battery paths"
          git push origin HEAD:fix/steering-homing-battery-traction
