name: Firmware Package

on:
  pull_request:
    branches: [main]
    paths:
      - 'Core/**'
      - 'Drivers/**'
      - 'esp32/**'
      - 'scripts/**'
      - 'Makefile'
      - '.cproject'
      - 'STM32G474RETX_FLASH.ld'
      - '.github/workflows/pr436-firmware-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-firmware:
    runs-on: ubuntu-24.04
    env:
      PACKAGE_LABEL: PR${{ github.event.pull_request.number || github.run_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build STM32 firmware
        run: |
          set -euo pipefail
          make clean
          make -j2

      - name: Build ESP32 firmware
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install --user platformio
          export PATH="$HOME/.local/bin:$PATH"
          cd esp32
          pio run -e esp32s3

      - name: Assemble flash and source package
        run: |
          set -euo pipefail
          mkdir -p artifacts/firmware/stm32 \
                   artifacts/firmware/esp32 \
                   artifacts/firmware/source

          cp build/STM32G474RE.bin artifacts/firmware/stm32/
          cp build/STM32G474RE.hex artifacts/firmware/stm32/
          cp build/STM32G474RE.elf artifacts/firmware/stm32/

          cp esp32/.pio/build/esp32s3/firmware.bin artifacts/firmware/esp32/
          cp esp32/.pio/build/esp32s3/firmware.elf artifacts/firmware/esp32/
          cp esp32/.pio/build/esp32s3/bootloader.bin artifacts/firmware/esp32/
          cp esp32/.pio/build/esp32s3/partitions.bin artifacts/firmware/esp32/

          git archive --format=zip \
            --prefix="STM32-Control-Coche-Marcos-${PACKAGE_LABEL}/" \
            HEAD > "artifacts/firmware/source/STM32-Control-Coche-Marcos-${PACKAGE_LABEL}-source.zip"

          cat > artifacts/firmware/README-FLASH.txt <<EOF
          ${PACKAGE_LABEL} - firmware y fuentes validadas

          STM32G474RE:
          - Recomendado con STM32CubeProgrammer: stm32/STM32G474RE.hex
          - Alternativa binaria: stm32/STM32G474RE.bin en 0x08000000
          - Verificar descarga y reset después de programar.

          ESP32-S3:
          - firmware.bin se programa normalmente en 0x10000.
          - bootloader.bin y partitions.bin se incluyen como respaldo de la compilación.
          - No es necesario reflashear el ESP32 si la PR solo cambia el STM32.

          Código fuente completo:
          - source/STM32-Control-Coche-Marcos-${PACKAGE_LABEL}-source.zip
          - Es un snapshot del commit exacto compilado por este workflow.
          - Para STM32: extraer el ZIP y ejecutar make clean && make -j2.
          - Para ESP32: entrar en esp32 y ejecutar pio run -e esp32s3.

          Seguridad para la primera prueba:
          - Vehículo inmovilizado y ruedas motrices elevadas.
          - Parada de emergencia accesible.
          - Comprobar primero homing, sensores, dirección y PWM sin carga.
          EOF

          printf '%s\n' "${GITHUB_SHA}" > artifacts/firmware/COMMIT.txt
          (cd artifacts/firmware && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload flashable firmware and complete source
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_LABEL }}-firmware-and-source-${{ github.sha }}
          path: artifacts/firmware/
          if-no-files-found: error
          retention-days: 90
