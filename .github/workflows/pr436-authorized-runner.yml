name: PR436 Authorized Patch Runner

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr436-authorized-runner.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/steering-homing-battery-traction'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/steering-homing-battery-traction
          fetch-depth: 1
          show-progress: false

      - name: Extract and apply exact audited patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'EXTRACT'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/pr436-authorized-autofix.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines)
                       if "python3 <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines))
                     if lines[i].strip() == 'PY')
          body = textwrap.dedent('\n'.join(lines[start + 1:end])) + '\n'

          old_helper = '''def replace(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} matches, found {count}\\n--- needle ---\\n{old}")
              write(path, text.replace(old, new))
          '''
          new_helper = '''def _trim_blank(lines):
              while lines and not lines[0].strip():
                  lines.pop(0)
              while lines and not lines[-1].strip():
                  lines.pop()
              return lines

          def replace(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count == expected:
                  write(path, text.replace(old, new))
                  return
              if count != 0:
                  raise RuntimeError(
                      f"{path}: expected {expected} exact matches, found {count}\\n"
                      f"--- needle ---\\n{old}")

              target = text.splitlines(keepends=True)
              old_lines = _trim_blank(old.splitlines())
              new_lines = _trim_blank(new.splitlines())
              old_key = [line.strip() for line in old_lines]
              width = len(old_key)
              matches = []
              for i in range(0, len(target) - width + 1):
                  if [line.strip() for line in target[i:i + width]] == old_key:
                      matches.append(i)
              if len(matches) != expected:
                  raise RuntimeError(
                      f"{path}: expected {expected} whitespace-normalized matches, "
                      f"found {len(matches)}\\n--- needle ---\\n{old}")

              rendered = textwrap.dedent("\\n".join(new_lines)).splitlines()
              for pos in reversed(matches):
                  first = target[pos]
                  base = first[:len(first) - len(first.lstrip())]
                  replacement = "".join(
                      ((base + line) if line else "") + "\\n"
                      for line in rendered
                  )
                  target[pos:pos + width] = [replacement]
              write(path, "".join(target))
          '''
          if body.count(old_helper) != 1:
              raise RuntimeError('unable to locate strict replace helper')
          body = body.replace('from pathlib import Path\n',
                              'from pathlib import Path\nimport textwrap\n', 1)
          body = body.replace(old_helper, new_helper, 1)
          Path('/tmp/pr436_authorized_fix.py').write_text(body, encoding='utf-8')
          EXTRACT

          set +e
          python3 /tmp/pr436_authorized_fix.py > /tmp/pr436_patch.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '=== EXACT PATCH FAILURE ==='
            cat /tmp/pr436_patch.log
            exit "$status"
          fi

          # GITHUB_TOKEN may push source changes but must not alter workflow files.
          # Workflow hardening/cleanup is performed afterwards through the GitHub
          # connector, which has the required workflow-file permission.
          git restore --source=HEAD -- \
            .github/workflows/pr436-authorized-autofix.yml \
            .github/workflows/pr436-authorized-runner.yml \
            .github/workflows/pr436-field-fixes.yml
          rm -f .github/pr436-patch-error.txt
          git diff --check

      - name: Publish exact traceback temporarily
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp /tmp/pr436_patch.log .github/pr436-patch-error.txt
          git config user.name 'PR436 Patch Diagnostic'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/pr436-patch-error.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record PR436 patch mismatch'
            git push origin HEAD:fix/steering-homing-battery-traction
          fi

      - name: Run focused executable tests
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -DHOST_TEST -ICore/Inc -O2 \
            Core/Src/test_battery_limits.c \
            -o /tmp/test_battery_limits_pr436
          /tmp/test_battery_limits_pr436

          gcc -std=c11 -DHOST_TEST -ICore/Inc -O2 \
            Core/Src/test_traction_output_policy.c \
            -o /tmp/test_traction_output_policy
          /tmp/test_traction_output_policy

          grep -q 'return BatteryLimitsStore_ServiceWriteAllowed();' Core/Src/can_handler.c
          grep -q 'raw_voltage < uv_cutoff_v' Core/Src/safety_system.c
          grep -q 'SteeringSupervisor_NeedsPostIsolationSample' Core/Src/steering_supervisor_io.c
          grep -q 's_guard.reverse_pending' Core/Src/steering_centering_patched.c

      - name: Commit code to the same PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PR436 Authorized Fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden PR436 steering traction and battery paths'
          git push origin HEAD:fix/steering-homing-battery-traction
