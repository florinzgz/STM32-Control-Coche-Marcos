name: PR436 Authorized Fixes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr436-authorized-fixes.yml'

permissions:
  contents: write

jobs:
  apply-authorized-fixes:
    if: github.event.pull_request.head.ref == 'fix/steering-homing-battery-traction'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/steering-homing-battery-traction
          fetch-depth: 0

      - name: Apply exact reviewed replacements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Make the editable Warning/Cutoff values govern the Safe-screen
          # battery classification once active 0x311 telemetry is available.
          replace_once(
              'esp32/src/screens/safe_screen.cpp',
              '''        const vehicle::BatteryData& bd = data.battery();
          batVoltRaw_ = bd.voltageRaw;

          const bool haveFrame = (bd.timestampMs > 0);''',
              '''        const vehicle::BatteryData& bd = data.battery();
          batVoltRaw_ = bd.voltageRaw;

          // Use the active runtime battery limits received through 0x311.  Until
          // the first valid limits frame arrives, keep the installed-pack
          // fallbacks from ui_config.h.  Malformed/incoherent telemetry also
          // fails back to those safe defaults instead of changing colours.
          const vehicle::BatteryLimitsData& limits = data.batteryLimits();
          batLimitsLive_ = limits.valid &&
              limits.cutoffCv > 0U &&
              limits.warningCv > limits.cutoffCv &&
              limits.warningCv <= BATT_OV_WARN_RAW;
          batWarnRaw_ = batLimitsLive_ ? limits.warningCv : BATT_UV_WARN_RAW;
          batCritRaw_ = batLimitsLive_ ? limits.cutoffCv  : BATT_UV_CRIT_RAW;

          const bool haveFrame = (bd.timestampMs > 0);''')

          replace_once('esp32/src/screens/safe_screen.cpp',
                       'batVoltRaw_ < BATT_UV_CRIT_RAW',
                       'batVoltRaw_ < batCritRaw_')
          replace_once('esp32/src/screens/safe_screen.cpp',
                       'batVoltRaw_ < BATT_UV_WARN_RAW',
                       'batVoltRaw_ < batWarnRaw_')
          replace_once(
              'esp32/src/screens/safe_screen.cpp',
              '''        bh = ui::tileHashFeed(bh, batSafe_);
          bh = ui::tileHashFeed(bh, (uint8_t)(batAgeMs_ / 1000U));''',
              '''        bh = ui::tileHashFeed(bh, batSafe_);
          bh = ui::tileHashFeed(bh, batWarnRaw_);
          bh = ui::tileHashFeed(bh, batCritRaw_);
          bh = ui::tileHashFeed(bh, batLimitsLive_);
          bh = ui::tileHashFeed(bh, (uint8_t)(batAgeMs_ / 1000U));''')

          # Keep the local editor validation aligned with the STM32 validator.
          replace_once(
              'esp32/src/screens/engineering_screen.cpp',
              '''    if (recovery <= cutoff) return false;
          if (warning  >  can::BATT_OV_WARNING_CV) return false;''',
              '''    if (recovery <= cutoff) return false;
          if (warning  <  limit) return false;
          if (warning  >  can::BATT_OV_WARNING_CV) return false;''')
          replace_once(
              'esp32/src/screens/engineering_screen.cpp',
              '''// rules: Warning/Limit/Recovery must each be strictly above Cutoff, and
          // Warning/Limit must not exceed the over-voltage warning point.''',
              '''// rules: Warning/Limit/Recovery must each be strictly above Cutoff,
          // Warning must be at least Limit, and Warning/Limit must not exceed the
          // over-voltage warning point.''')

          # Remove retired fixed-voltage guidance from production comments.
          replacements = [
              ('above 18.5 V (CRITICAL + hysteresis)',
               'above the configured Recovery threshold'),
              ('voltage is back above 18.5 V and',
               'voltage is back above the configured Recovery threshold and'),
              ('above the critical+hysteresis threshold (18.5 V),',
               'above the configured Recovery threshold,'),
              ('filter_ms == 0 (default): bypass — voltage == raw, identical to today.',
               'filter_ms == 0: bypass — voltage == raw.'),
              ('Uses the runtime derate (Limit) threshold; default 20.0 V.',
               'Uses the runtime derate (Limit) threshold; installed default 17.0 V.'),
              ('(default 20.5 V) to prevent oscillation under load transients.',
               '(installed default 17.5 V) to prevent oscillation under load transients.'),
          ]
          for old, new in replacements:
              replace_once('Core/Src/safety_system.c', old, new)

          # Correct two stale HMI comments; execution already used the new constants.
          replace_once(
              'esp32/src/ui/battery_indicator.cpp',
              '// 24V lead-acid/LiFePO4 pack: 18.0V = 0%, 25.2V = 100%',
              '// Installed traction pack display: 16.0 V = 0%, 28.5 V = 100%')
          replace_once(
              'esp32/src/ui/ui_config.h',
              '''// Battery voltage thresholds (0.01 V units) mirroring the STM32 firmware limits
          // reported via SafetyError codes (BATTERY_UV_WARN/CRIT, BATTERY_OV_WARN/CRIT).''',
              '''// Battery voltage fallback thresholds (0.01 V units).  SafeScreen uses
          // active 0x311 Warning/Cutoff values when available and these installed-pack
          // defaults before valid limits telemetry arrives.''')
          PY

      - name: Validate focused contracts
        run: |
          set -euo pipefail
          gcc -std=c11 -DHOST_TEST -ICore/Inc -O2 \
            Core/Src/test_traction_output_policy.c -lm \
            -o /tmp/test_traction_output_policy
          /tmp/test_traction_output_policy
          grep -q 'batVoltRaw_ < batWarnRaw_' esp32/src/screens/safe_screen.cpp
          grep -q 'batVoltRaw_ < batCritRaw_' esp32/src/screens/safe_screen.cpp
          grep -q 'warning  <  limit' esp32/src/screens/engineering_screen.cpp

      - name: Commit firmware changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Core/Src/safety_system.c \
                  esp32/src/screens/safe_screen.cpp \
                  esp32/src/screens/engineering_screen.cpp \
                  esp32/src/ui/battery_indicator.cpp \
                  esp32/src/ui/ui_config.h
          git commit -m 'fix: conectar Warning al HMI y limpiar contratos antiguos'
          git push origin HEAD:fix/steering-homing-battery-traction
