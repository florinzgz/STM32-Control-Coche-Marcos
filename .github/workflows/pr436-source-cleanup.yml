name: PR436 Source Cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr436-source-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'fix/steering-homing-battery-traction'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/steering-homing-battery-traction
          fetch-depth: 1
          show-progress: false

      - name: Remove exact unused helper
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('Core/Src/motor_control_patched.c')
          text = path.read_text(encoding='utf-8')
          old = '''static void brake_all(void)
          {
              Motor_SetMode(&motor_fl, MOTOR_MODE_BRAKE, 0);
              Motor_SetMode(&motor_fr, MOTOR_MODE_BRAKE, 0);
              Motor_SetMode(&motor_rl, MOTOR_MODE_BRAKE, 0);
              Motor_SetMode(&motor_rr, MOTOR_MODE_BRAKE, 0);
          }

          '''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one unused brake_all helper')
          path.write_text(text.replace(old, ''), encoding='utf-8')
          PY
          git diff --check
          git restore --source=HEAD -- .github/workflows/pr436-source-cleanup.yml

      - name: Commit source cleanup
        run: |
          set -euo pipefail
          git config user.name 'PR436 Authorized Fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Core/Src/motor_control_patched.c
          git commit -m 'fix: remove obsolete drivetrain brake helper'
          git push origin HEAD:fix/steering-homing-battery-traction
