name: Debug PR429 patch

on:
  push:
    branches:
      - fix/can-heartbeat-deterministic
    paths:
      - '.github/workflows/debug-pr429-patch.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/debug-pr429-patch.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/can-heartbeat-deterministic
          fetch-depth: 0

      - name: Execute patch and capture traceback
        shell: bash
        run: |
          set +e
          python3 <<'RUNNER' > pr429-patch-debug.txt 2>&1
          from pathlib import Path
          import traceback

          try:
              workflow = Path('.github/workflows/apply-pr429-safety-fixes.yml').read_text(encoding='utf-8')
              marker = "          python3 <<'PY'\n"
              start = workflow.index(marker) + len(marker)
              end = workflow.index("\n          PY\n", start)
              block = workflow[start:end]
              code = '\n'.join(line[10:] if line.startswith('          ') else line
                               for line in block.splitlines())
              code = code.replace(
                  "'Core/Src/steering_centering.c',\n    '    s_diag.power_ready",
                  "'Core/Src/steering_centering_diag.c',\n    '    s_diag.power_ready",
                  1)
              exec(compile(code, 'pr429_safety_patch.py', 'exec'))
              print('PATCH_EXECUTION_OK')
          except BaseException:
              traceback.print_exc()
              print('PATCH_EXECUTION_FAILED')
          RUNNER
          exit 0

      - name: Upload patch diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr429-patch-debug
          path: pr429-patch-debug.txt
