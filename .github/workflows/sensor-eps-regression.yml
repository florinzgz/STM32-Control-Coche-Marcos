name: Sensor and EPS Regression

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'Makefile'
      - 'Core/Inc/current_plausibility.h'
      - 'Core/Inc/eps_output_policy.h'
      - 'Core/Inc/eps_assist_policy.h'
      - 'Core/Src/safety_system.c'
      - 'Core/Src/motor_control.c'
      - 'Core/Src/motor_control_patched.c'
      - 'Core/Src/test_current_plausibility.c'
      - 'Core/Src/test_eps_output_policy.c'
      - 'Core/Src/test_eps_assist_policy.c'
      - 'scripts/check_effective_eps_wrapper.py'
      - 'esp32/src/degraded_banner.h'
      - 'esp32/src/screens/drive_screen.cpp'
      - 'esp32/src/screens/drive_screen.h'
      - 'esp32/host_tests/test_degraded_banner.cpp'
      - '.github/workflows/sensor-eps-regression.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Makefile'
      - 'Core/Inc/current_plausibility.h'
      - 'Core/Inc/eps_output_policy.h'
      - 'Core/Inc/eps_assist_policy.h'
      - 'Core/Src/safety_system.c'
      - 'Core/Src/motor_control.c'
      - 'Core/Src/motor_control_patched.c'
      - 'Core/Src/test_current_plausibility.c'
      - 'Core/Src/test_eps_output_policy.c'
      - 'Core/Src/test_eps_assist_policy.c'
      - 'scripts/check_effective_eps_wrapper.py'
      - 'esp32/src/degraded_banner.h'
      - 'esp32/src/screens/drive_screen.cpp'
      - 'esp32/src/screens/drive_screen.h'
      - 'esp32/host_tests/test_degraded_banner.cpp'
      - '.github/workflows/sensor-eps-regression.yml'

permissions:
  contents: write

jobs:
  apply-pr440-reviewed-followup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 440 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/eps-low-speed-assist'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed PR440 patches
        run: |
          set -euo pipefail
          for patch in .github/pr440-patches/*.patch; do
            git apply --check "$patch"
            git apply --index "$patch"
          done
          gcc -std=c11 -Wall -Wextra -Werror -ICore/Inc \
            Core/Src/test_eps_assist_policy.c -lm -o /tmp/test_eps_assist_policy
          /tmp/test_eps_assist_policy
          python3 scripts/check_effective_eps_wrapper.py
          gcc -std=c11 -Wall -Wextra -Werror -ICore/Inc \
            Core/Src/test_traction_limit_frame.c -lm -o /tmp/test_traction_limit_frame
          /tmp/test_traction_limit_frame
          g++ -std=c++17 -Wall -Wextra -Werror -ICore/Inc -Iesp32/src \
            esp32/src/test_traction_limit_diag_decode.cpp -lm \
            -o /tmp/test_traction_limit_diag_decode
          /tmp/test_traction_limit_diag_decode
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden EPS reversal and expose traction limits"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Current plausibility policy
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -ICore/Inc \
            Core/Src/test_current_plausibility.c -lm \
            -o /tmp/test_current_plausibility
          /tmp/test_current_plausibility

      - name: EPS coast and minimum-drive policy
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -ICore/Inc \
            Core/Src/test_eps_output_policy.c -lm \
            -o /tmp/test_eps_output_policy
          /tmp/test_eps_output_policy

      - name: EPS low-speed assist policy
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -ICore/Inc \
            Core/Src/test_eps_assist_policy.c -lm \
            -o /tmp/test_eps_assist_policy
          /tmp/test_eps_assist_policy

      - name: Effective production EPS wrapper
        run: python3 scripts/check_effective_eps_wrapper.py

      - name: HMI degraded-level banner
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src \
            esp32/host_tests/test_degraded_banner.cpp \
            -o /tmp/test_degraded_banner
          /tmp/test_degraded_banner

      - name: Remaining production integration guards
        run: |
          grep -q 'CurrentPlausibility_IsFault' Core/Src/safety_system.c
          grep -q 'curDegradedLevel_' esp32/src/screens/drive_screen.cpp
