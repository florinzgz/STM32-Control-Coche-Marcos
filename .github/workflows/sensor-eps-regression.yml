name: Sensor and EPS Regression

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'Makefile'
      - 'Core/Inc/can_handler.h'
      - 'Core/Inc/motor_control.h'
      - 'Core/Src/can_handler.c'
      - 'Core/Src/main.c'
      - 'esp32/include/can_ids.h'
      - 'esp32/src/vehicle_data.h'
      - 'esp32/src/can_rx.cpp'
      - 'esp32/src/screens/engineering_screen.cpp'
      - 'esp32/src/screens/engineering_screen.h'
      - 'Core/Inc/current_plausibility.h'
      - 'Core/Inc/eps_output_policy.h'
      - 'Core/Inc/eps_assist_policy.h'
      - 'Core/Inc/traction_limit_frame.h'
      - 'Core/Src/safety_system.c'
      - 'Core/Src/motor_control.c'
      - 'Core/Src/motor_control_patched.c'
      - 'Core/Src/test_current_plausibility.c'
      - 'Core/Src/test_eps_output_policy.c'
      - 'Core/Src/test_eps_assist_policy.c'
      - 'Core/Src/test_traction_limit_frame.c'
      - 'scripts/check_effective_eps_wrapper.py'
      - 'esp32/src/degraded_banner.h'
      - 'esp32/src/screens/drive_screen.cpp'
      - 'esp32/src/screens/drive_screen.h'
      - 'esp32/host_tests/test_degraded_banner.cpp'
      - 'esp32/src/traction_limit_diag_view.h'
      - 'esp32/src/test_traction_limit_diag_decode.cpp'
      - '.github/workflows/sensor-eps-regression.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Makefile'
      - 'Core/Inc/can_handler.h'
      - 'Core/Inc/motor_control.h'
      - 'Core/Src/can_handler.c'
      - 'Core/Src/main.c'
      - 'esp32/include/can_ids.h'
      - 'esp32/src/vehicle_data.h'
      - 'esp32/src/can_rx.cpp'
      - 'esp32/src/screens/engineering_screen.cpp'
      - 'esp32/src/screens/engineering_screen.h'
      - 'Core/Inc/current_plausibility.h'
      - 'Core/Inc/eps_output_policy.h'
      - 'Core/Inc/eps_assist_policy.h'
      - 'Core/Inc/traction_limit_frame.h'
      - 'Core/Src/safety_system.c'
      - 'Core/Src/motor_control.c'
      - 'Core/Src/motor_control_patched.c'
      - 'Core/Src/test_current_plausibility.c'
      - 'Core/Src/test_eps_output_policy.c'
      - 'Core/Src/test_eps_assist_policy.c'
      - 'Core/Src/test_traction_limit_frame.c'
      - 'scripts/check_effective_eps_wrapper.py'
      - 'esp32/src/degraded_banner.h'
      - 'esp32/src/screens/drive_screen.cpp'
      - 'esp32/src/screens/drive_screen.h'
      - 'esp32/host_tests/test_degraded_banner.cpp'
      - 'esp32/src/traction_limit_diag_view.h'
      - 'esp32/src/test_traction_limit_diag_decode.cpp'
      - '.github/workflows/sensor-eps-regression.yml'

permissions:
  contents: write

jobs:
  apply-pr441-service-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 441 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified service changes
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/pr441-service.patch
          for part in .github/pr441_patch/part*.b64; do
            base64 --ignore-garbage --decode "$part" >> /tmp/pr441-service.patch
          done
          sha256sum /tmp/pr441-service.patch
          git apply --3way --exclude='Core/Src/motor_control_patched.c' \
            /tmp/pr441-service.patch

          python3 - <<'PY'
          from pathlib import Path

          path = Path('Core/Src/motor_control_patched.c')
          text = path.read_text(encoding='utf-8')
          include_anchor = '#include "eps_assist_policy.h"\n'
          helper_marker = 'PR_MotorPedalCalServiceActive'
          helper = '''#include "can_handler.h"

#ifdef HOST_TEST
extern bool CAN_PedalCalServiceActive(void) __attribute__((weak));
static bool PR_MotorPedalCalServiceActive(void)
{
    return CAN_PedalCalServiceActive != 0 &&
           CAN_PedalCalServiceActive();
}
#else
static bool PR_MotorPedalCalServiceActive(void)
{
    return CAN_PedalCalServiceActive();
}
#endif
'''
          if helper_marker not in text:
              if text.count(include_anchor) != 1:
                  raise SystemExit('motor wrapper include anchor missing or ambiguous')
              text = text.replace(include_anchor, include_anchor + helper, 1)

          function_anchor = 'void Traction_Update(void)\n{\n'
          lock_marker = 'highest-priority physical motion inhibit'
          lock = '''    /* Pedal-calibration service lock is an independent,
     * highest-priority physical motion inhibit.  Do not evaluate ramps,
     * tank turn, Ackermann, ABS/TCS or base demand while it owns the vehicle. */
    if (PR_MotorPedalCalServiceActive()) {
        (void)Traction_CalibrationLock();
        coast_all();
        zero_output_telemetry();
        Traction_UpdateMotionInhibit(0.0f, 0U);
        return;
    }

'''
          if lock_marker not in text:
              if text.count(function_anchor) != 1:
                  raise SystemExit('effective Traction_Update anchor missing or ambiguous')
              text = text.replace(function_anchor, function_anchor + lock, 1)

          if text.count(helper_marker) < 3:
              raise SystemExit('service helper was not integrated completely')
          if text.count(lock_marker) != 1:
              raise SystemExit('service lock insertion is not unique')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Run focused safety tests
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -DHOST_TEST \
            -ICore/Inc Core/Src/test_pedal_cal_session.c \
            Core/Src/pedal_cal_session.c -lm -o /tmp/test_pedal_cal_session
          /tmp/test_pedal_cal_session
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iesp32/src -Iesp32/test_stubs \
            esp32/src/traction_switch.cpp esp32/src/test_mode_sync.cpp \
            -o /tmp/test_mode_sync
          /tmp/test_mode_sync
          gcc -std=c11 -Wall -Wextra -Werror \
            -DHOST_TEST -DHOST_TEST_GPIO_MODEL -D_GNU_SOURCE \
            -Ianalysis_artifacts/stubs -ICore/Inc -O2 \
            Core/Src/test_relay_seq_eps.c Core/Src/safety_system_patched.c \
            Core/Src/steering_eps.c Core/Src/math_safety.c -lm \
            -o /tmp/test_relay_seq_eps
          /tmp/test_relay_seq_eps
          python3 scripts/check_effective_eps_wrapper.py

      - name: Commit productive files only
        shell: bash
        run: |
          set -euo pipefail
          git checkout '${{ github.event.pull_request.base.sha }}' -- .github/workflows/sensor-eps-regression.yml
          rm -rf .github/pr441_patch
          rm -f .github/workflows/apply-pr441-service-fix.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix service calibration, degraded recovery and local controls'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Current plausibility policy
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -ICore/Inc \
            Core/Src/test_current_plausibility.c -lm \
            -o /tmp/test_current_plausibility
          /tmp/test_current_plausibility

      - name: EPS coast and minimum-drive policy
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -ICore/Inc \
            Core/Src/test_eps_output_policy.c -lm \
            -o /tmp/test_eps_output_policy
          /tmp/test_eps_output_policy

      - name: EPS low-speed assist policy
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -ICore/Inc \
            Core/Src/test_eps_assist_policy.c -lm \
            -o /tmp/test_eps_assist_policy
          /tmp/test_eps_assist_policy

      - name: Effective production EPS wrapper
        run: python3 scripts/check_effective_eps_wrapper.py

      - name: Traction limit CAN frame contract
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -ICore/Inc \
            Core/Src/test_traction_limit_frame.c -lm \
            -o /tmp/test_traction_limit_frame
          /tmp/test_traction_limit_frame
          g++ -std=c++17 -Wall -Wextra -Werror \
            -ICore/Inc -Iesp32/src \
            esp32/src/test_traction_limit_diag_decode.cpp -lm \
            -o /tmp/test_traction_limit_diag_decode
          /tmp/test_traction_limit_diag_decode

      - name: HMI degraded-level banner
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src \
            esp32/host_tests/test_degraded_banner.cpp \
            -o /tmp/test_degraded_banner
          /tmp/test_degraded_banner

      - name: Remaining production integration guards
        run: |
          grep -q 'CurrentPlausibility_IsFault' Core/Src/safety_system.c
          grep -q 'curDegradedLevel_' esp32/src/screens/drive_screen.cpp
