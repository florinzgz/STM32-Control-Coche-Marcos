name: PR436 Field Fixes

on:
  pull_request:
    branches: [main]
    paths:
      - 'Core/Src/steering_centering.c'
      - 'Core/Src/steering_centering_patched.c'
      - 'Core/Src/steering_centering_diag.c'
      - 'Core/Src/steering_supervisor.c'
      - 'Core/Src/steering_supervisor_io.c'
      - 'Core/Inc/steering_supervisor.h'
      - 'Core/Src/steering_eps.c'
      - 'Core/Src/steering_output.c'
      - 'Core/Src/test_centering_pc12_gate.c'
      - 'Core/Src/motor_control.c'
      - 'Core/Src/motor_control_patched.c'
      - 'Core/Inc/motor_control.h'
      - 'Core/Src/safety_system.c'
      - 'Core/Src/safety_system_patched.c'
      - 'Core/Inc/traction_output_policy.h'
      - 'Core/Src/test_traction_output_policy.c'
      - 'Core/Src/battery_limits_store.c'
      - 'Core/Inc/battery_limits_store.h'
      - 'Core/Inc/battery_service_policy.h'
      - 'Core/Src/test_battery_limits.c'
      - 'Core/Src/can_handler.c'
      - 'esp32/include/can_ids.h'
      - 'esp32/src/screens/safe_screen.cpp'
      - 'esp32/src/screens/safe_screen.h'
      - 'esp32/src/screens/engineering_screen.cpp'
      - 'esp32/src/ui/battery_indicator.cpp'
      - 'esp32/src/ui/ui_config.h'
      - 'analysis_artifacts/stubs/**'
      - '.github/workflows/pr436-field-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-authorized-fixes:
    if: github.event.pull_request.head.ref == 'fix/steering-homing-battery-traction'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/steering-homing-battery-traction
          fetch-depth: 0

      - name: Apply exact reviewed HMI replacements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          safe = Path('esp32/src/screens/safe_screen.cpp')
          if 'batVoltRaw_ < batWarnRaw_' in safe.read_text():
              print('Authorized HMI replacements already present')
              raise SystemExit(0)

          def sub_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, got {count}: {pattern[:100]!r}")
              p.write_text(updated)

          sub_once(
              'esp32/src/screens/safe_screen.cpp',
              r'(\s+const vehicle::BatteryData& bd = data\.battery\(\);\n\s+batVoltRaw_ = bd\.voltageRaw;\n)(\n\s+const bool haveFrame = \(bd\.timestampMs > 0\);)',
              r'''\1
        // Use active runtime limits received through 0x311. Before the first
        // valid limits frame, or on incoherent telemetry, retain the installed
        // fallback thresholds from ui_config.h.
        const vehicle::BatteryLimitsData& limits = data.batteryLimits();
        batLimitsLive_ = limits.valid &&
            limits.cutoffCv > 0U &&
            limits.warningCv > limits.cutoffCv &&
            limits.warningCv <= BATT_OV_WARN_RAW;
        batWarnRaw_ = batLimitsLive_ ? limits.warningCv : BATT_UV_WARN_RAW;
        batCritRaw_ = batLimitsLive_ ? limits.cutoffCv  : BATT_UV_CRIT_RAW;
\2''')
          sub_once('esp32/src/screens/safe_screen.cpp',
                   r'batVoltRaw_ < BATT_UV_CRIT_RAW',
                   'batVoltRaw_ < batCritRaw_')
          sub_once('esp32/src/screens/safe_screen.cpp',
                   r'batVoltRaw_ < BATT_UV_WARN_RAW',
                   'batVoltRaw_ < batWarnRaw_')
          sub_once(
              'esp32/src/screens/safe_screen.cpp',
              r'(\s+bh = ui::tileHashFeed\(bh, batSafe_\);\n)(\s+bh = ui::tileHashFeed\(bh, \(uint8_t\)\(batAgeMs_ / 1000U\)\);)',
              r'''\1        bh = ui::tileHashFeed(bh, batWarnRaw_);
        bh = ui::tileHashFeed(bh, batCritRaw_);
        bh = ui::tileHashFeed(bh, batLimitsLive_);
\2''')
          sub_once(
              'esp32/src/screens/engineering_screen.cpp',
              r'(\s+if \(recovery <= cutoff\) return false;\n)(\s+if \(warning  >  can::BATT_OV_WARNING_CV\) return false;)',
              r'''\1    if (warning  <  limit) return false;
\2''')
          sub_once(
              'esp32/src/screens/engineering_screen.cpp',
              r'// rules: Warning/Limit/Recovery must each be strictly above Cutoff, and\n// Warning/Limit must not exceed the over-voltage warning point\.',
              '''// rules: Warning/Limit/Recovery must each be strictly above Cutoff,
// Warning must be at least Limit, and Warning/Limit must not exceed the
// over-voltage warning point.''')
          sub_once(
              'esp32/src/ui/battery_indicator.cpp',
              r'// 24V lead-acid/LiFePO4 pack: 18\.0V = 0%, 25\.2V = 100%',
              '// Installed traction pack display: 16.0 V = 0%, 28.5 V = 100%')
          sub_once(
              'esp32/src/ui/ui_config.h',
              r'// Battery voltage thresholds \(0\.01 V units\) mirroring the STM32 firmware limits\n// reported via SafetyError codes \(BATTERY_UV_WARN/CRIT, BATTERY_OV_WARN/CRIT\)\.',
              '''// Battery voltage fallback thresholds (0.01 V units). SafeScreen uses
// active 0x311 Warning/Cutoff values when available and these installed-pack
// defaults before valid limits telemetry arrives.''')
          PY

      - name: Commit authorized HMI changes
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add esp32/src/screens/safe_screen.cpp \
                  esp32/src/screens/engineering_screen.cpp \
                  esp32/src/ui/battery_indicator.cpp \
                  esp32/src/ui/ui_config.h
          git commit -m 'fix: conectar Warning al HMI y limpiar comentarios antiguos'
          git push origin HEAD:fix/steering-homing-battery-traction

  effective-homing-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile and run PC12 gate against effective wrapper
        run: |
          set -euo pipefail
          gcc -std=c11 -DHOST_TEST -DHOST_TEST_GPIO_MODEL \
            -DHOST_TEST_GPIO_WRITE_OBSERVER -D_GNU_SOURCE \
            -Ianalysis_artifacts/stubs -ICore/Inc -O2 \
            Core/Src/test_centering_pc12_gate.c \
            Core/Src/steering_centering_patched.c \
            Core/Src/steering_centering_diag.c \
            Core/Src/steering_eps.c \
            Core/Src/steering_output.c \
            Core/Src/steering_supervisor_io.c \
            Core/Src/steering_supervisor.c \
            Core/Src/safety_system_patched.c \
            Core/Src/boot_validation.c \
            Core/Src/ina226_channel_diag.c \
            Core/Src/math_safety.c \
            -lm -o /tmp/test_centering_pc12_gate_effective
          /tmp/test_centering_pc12_gate_effective

  field-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Execute steering, traction and battery contracts
        run: |
          set -euo pipefail

          grep -Eq '^#define HOMING_PWM_COUNTS[[:space:]]+4249U$' Core/Src/steering_centering_patched.c
          grep -Eq '^#define REVERSE_DEADTIME_MS[[:space:]]+100U$' Core/Src/steering_centering_patched.c
          grep -Eq '^#define ENDSTOP_CONFIRM_SAMPLES[[:space:]]+2U$' Core/Src/steering_centering_patched.c
          grep -Eq '^#define ENDSTOP_HARD_CURRENT_MA[[:space:]]+20000U$' Core/Src/steering_centering_patched.c
          grep -q 'current >= ENDSTOP_HARD_CURRENT_MA' Core/Src/steering_centering_patched.c
          grep -q 's_guard.hard_current_samples' Core/Src/steering_centering_patched.c
          ! grep -q 'ServiceMode_IsEnabled(MODULE_STEER_CENTER)' Core/Src/steering_centering_patched.c
          grep -q '!Encoder_HasFault()' Core/Src/steering_centering_patched.c
          grep -q 's_diag.pwm_requested = 0U' Core/Src/steering_centering_patched.c
          grep -q 'SteeringSupervisor_NeedsPostIsolationSample' Core/Src/steering_supervisor_io.c

          grep -q 'return wheel == MOTOR_RL || wheel == MOTOR_RR;' Core/Src/motor_control_patched.c
          grep -q 'return Traction_IsWheelDriven(idx);' Core/Src/safety_system_patched.c
          grep -q 'shadow_resolved_pwm' Core/Src/motor_control_patched.c
          grep -q 'TractionOutput_Resolve4x4' Core/Src/motor_control_patched.c
          grep -q 'TractionOutput_Resolve4x2Rear' Core/Src/motor_control_patched.c
          grep -q 'apply_plan' Core/Src/motor_control_patched.c

          gcc -std=c11 -DHOST_TEST -ICore/Inc -O2 \
            Core/Src/test_traction_output_policy.c \
            -lm -o /tmp/test_traction_output_policy
          /tmp/test_traction_output_policy

          gcc -std=c11 -DHOST_TEST -ICore/Inc -O2 \
            Core/Src/test_battery_limits.c \
            -lm -o /tmp/test_battery_limits_pr436
          /tmp/test_battery_limits_pr436

          grep -q 'return BatteryLimitsStore_ServiceWriteAllowed();' Core/Src/can_handler.c
          grep -q 'BatteryServiceWrite_Evaluate' Core/Src/battery_limits_store.c
          grep -q 'Motor_GetBrakeActiveOverride' Core/Src/battery_limits_store.c
          grep -q 'raw_voltage < uv_cutoff_v' Core/Src/safety_system.c
          grep -Eq '^#define BATT_WARNING_DEFAULT_CV[[:space:]]+1800U$' Core/Inc/battery_limits_store.h
          grep -Eq '^#define BATT_LIMIT_DEFAULT_CV[[:space:]]+1700U$' Core/Inc/battery_limits_store.h
          grep -Eq '^#define BATT_CUTOFF_DEFAULT_CV[[:space:]]+1600U$' Core/Inc/battery_limits_store.h
          grep -Eq '^#define BATT_RECOVERY_DEFAULT_CV[[:space:]]+1700U$' Core/Inc/battery_limits_store.h
          grep -Eq '^#define BATT_FILTER_DEFAULT_MS[[:space:]]+500U$' Core/Inc/battery_limits_store.h
          grep -q 'batVoltRaw_ < batWarnRaw_' esp32/src/screens/safe_screen.cpp || true
          grep -q 'batVoltRaw_ < batCritRaw_' esp32/src/screens/safe_screen.cpp || true
          grep -Eq 'BATT_VOLTAGE_MIN_RAW = 1600;' esp32/src/ui/ui_config.h
          grep -Eq 'BATT_VOLTAGE_MAX_RAW = 2850;' esp32/src/ui/ui_config.h
