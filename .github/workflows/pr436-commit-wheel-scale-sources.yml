name: PR436 Commit Wheel Scale Source Correction

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr436-commit-wheel-scale-sources.yml'

permissions:
  contents: write

jobs:
  commit-sources:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/steering-homing-battery-traction
          fetch-depth: 0

      - name: Apply explicit ABS/TCS cycle baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: source contract mismatch')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'Core/Inc/safety_system.h',
              'void Safety_Init(void);\nvoid ABS_Update(void);',
              'void Safety_Init(void);\n'
              '/* Rebuild the per-wheel ABS/TCS authority baseline once at the start\n'
              ' * of each 100 Hz control cycle, before ABS_Update() and TCS_Update(). */\n'
              'void Safety_ResetWheelInterventionScales(void);\n'
              'void ABS_Update(void);'
          )

          replace_once(
              'Core/Src/safety_system_patched.c',
              '/* ABS owns the start-of-cycle baseline because main.c always calls ABS_Update()\n'
              ' * immediately before TCS_Update().  Rebuild all four permissions from 1.0 every\n'
              ' * 10 ms, then let ABS and TCS apply only their CURRENT reductions.  The motor\n'
              ' * controller reapplies independent temperature/current cutoffs later in the\n'
              ' * same cycle, so no real hardware protection is weakened. */\n'
              'static void PR_ResetWheelInterventionScales(void)',
              '/* The scheduler owns the start-of-cycle baseline and calls this once after\n'
              ' * Wheel_UpdateSpeeds() and before ABS/TCS.  ABS also invokes it defensively so\n'
              ' * direct test or diagnostic calls cannot inherit a stale historical reduction.\n'
              ' * Temperature/current cutoffs are reapplied independently by Traction_Update(). */\n'
              'void Safety_ResetWheelInterventionScales(void)'
          )

          replace_once(
              'Core/Src/safety_system_patched.c',
              '    PR_ResetWheelInterventionScales();',
              '    Safety_ResetWheelInterventionScales();'
          )

          replace_once(
              'Core/Src/main.c',
              '            Wheel_UpdateSpeeds();\n\n            ABS_Update();\n            TCS_Update();',
              '            Wheel_UpdateSpeeds();\n\n'
              '            /* Start every ABS/TCS arbitration cycle from full per-wheel\n'
              '             * authority.  ABS and tuned TCS may only lower the current\n'
              '             * cycle values; no historical reduction can remain latched. */\n'
              '            Safety_ResetWheelInterventionScales();\n'
              '            ABS_Update();\n'
              '            TCS_Update();'
          )
          PY

          git diff --check
          grep -q 'Safety_ResetWheelInterventionScales();' Core/Src/main.c
          grep -q '^void Safety_ResetWheelInterventionScales(void)$' Core/Src/safety_system_patched.c
          grep -q '^void Safety_ResetWheelInterventionScales(void);$' Core/Inc/safety_system.h

      - name: Commit and push firmware sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Core/Inc/safety_system.h Core/Src/safety_system_patched.c Core/Src/main.c
          git commit -m 'fix: reset ABS/TCS wheel scales at cycle entry'
          git push origin HEAD:fix/steering-homing-battery-traction
