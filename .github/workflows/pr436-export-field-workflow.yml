name: PR436 Export Corrected Field Workflow

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr436-export-field-workflow.yml'

permissions:
  contents: read

jobs:
  export-workflow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/steering-homing-battery-traction
          persist-credentials: false

      - name: Patch field-contract workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/pr436-field-fixes.yml')
          text = p.read_text(encoding='utf-8')

          old_path = "      - 'Core/Src/safety_system_patched.c'\n      - 'Core/Inc/traction_output_policy.h'"
          new_path = "      - 'Core/Src/safety_system_patched.c'\n      - 'Core/Inc/safety_system.h'\n      - 'Core/Inc/traction_output_policy.h'"
          if text.count(old_path) != 1:
              raise SystemExit('field workflow path contract did not match once')
          text = text.replace(old_path, new_path, 1)

          old_contract = (
              "          cycle = main.index('Wheel_UpdateSpeeds();')\n"
              "          abs_call = main.index('ABS_Update();', cycle)\n"
              "          tcs_call = main.index('TCS_Update();', abs_call)\n"
              "          traction_call = main.index('Traction_Update();', tcs_call)\n"
              "          assert cycle < abs_call < tcs_call < traction_call\n\n"
              "          safety = open('Core/Src/safety_system_patched.c', encoding='utf-8').read()\n"
              "          abs_fn = safety.index('void ABS_Update(void)')\n"
              "          reset_call = safety.index('PR_ResetWheelInterventionScales();', abs_fn)\n"
              "          abs_gate = safety.index('if (!ServiceMode_IsEnabled(MODULE_ABS)', abs_fn)\n"
              "          assert abs_fn < reset_call < abs_gate"
          )
          new_contract = (
              "          cycle = main.index('Wheel_UpdateSpeeds();')\n"
              "          reset_call = main.index('Safety_ResetWheelInterventionScales();', cycle)\n"
              "          abs_call = main.index('ABS_Update();', reset_call)\n"
              "          tcs_call = main.index('TCS_Update();', abs_call)\n"
              "          traction_call = main.index('Traction_Update();', tcs_call)\n"
              "          assert cycle < reset_call < abs_call < tcs_call < traction_call\n\n"
              "          header = open('Core/Inc/safety_system.h', encoding='utf-8').read()\n"
              "          assert 'void Safety_ResetWheelInterventionScales(void);' in header\n\n"
              "          safety = open('Core/Src/safety_system_patched.c', encoding='utf-8').read()\n"
              "          reset_fn = safety.index('void Safety_ResetWheelInterventionScales(void)')\n"
              "          abs_fn = safety.index('void ABS_Update(void)', reset_fn)\n"
              "          defensive_reset = safety.index('Safety_ResetWheelInterventionScales();', abs_fn)\n"
              "          abs_gate = safety.index('if (!ServiceMode_IsEnabled(MODULE_ABS)', abs_fn)\n"
              "          assert reset_fn < abs_fn < defensive_reset < abs_gate"
          )
          if text.count(old_contract) != 1:
              raise SystemExit('field workflow ordering contract did not match once')
          p.write_text(text.replace(old_contract, new_contract, 1), encoding='utf-8')
          PY
          cp .github/workflows/pr436-field-fixes.yml pr436-field-fixes.yml

      - name: Upload corrected field workflow
        uses: actions/upload-artifact@v4
        with:
          name: pr436-corrected-field-workflow
          path: pr436-field-fixes.yml
          if-no-files-found: error
