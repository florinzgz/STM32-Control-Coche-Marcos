name: PR429 audited safety patch

on:
  push:
    branches:
      - fix/can-heartbeat-deterministic
    paths:
      - '.github/workflows/firmware-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/firmware-validation.yml'

permissions:
  contents: write

concurrency:
  group: pr429-audited-safety-patch
  cancel-in-progress: false

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/can-heartbeat-deterministic
          fetch-depth: 0

      - name: Execute audited patch program
        run: |
          python3 <<'RUNNER'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-pr429-safety-fixes.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line
                           for line in block.splitlines())
          # The original helper targeted the diagnostic assignment in the wrong
          # translation unit. Correct it before executing the audited patch.
          code = code.replace(
              "'Core/Src/steering_centering.c',\n    '    s_diag.power_ready",
              "'Core/Src/steering_centering_diag.c',\n    '    s_diag.power_ready",
              1)
          exec(compile(code, 'pr429_safety_patch.py', 'exec'))
          RUNNER

      - name: Install validation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cppcheck flawfinder clang-tools
          python3 -m pip install --user lizard==1.17.10 platformio
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run complete STM32 host test matrix
        run: |
          set -euo pipefail
          for src in \
            Core/Src/test_motor_control.c \
            Core/Src/test_math_safety.c \
            Core/Src/test_error_log.c \
            Core/Src/test_service_mode.c \
            Core/Src/test_eps_params.c \
            Core/Src/test_sensor_calibration.c \
            Core/Src/test_wheel_speed.c \
            Core/Src/test_wheel_fault_gate.c \
            Core/Src/test_obstacle_fault_state.c \
            Core/Src/test_wheel_diag_can.c \
            Core/Src/test_gear_limits.c \
            Core/Src/test_drive_tuning.c \
            Core/Src/test_battery_limits.c \
            Core/Src/test_steering_cal_store.c \
            Core/Src/test_steering_z.c \
            Core/Src/test_steering_centering.c \
            Core/Src/test_steering_centering_diag.c \
            Core/Src/test_steering_centering_frame.c \
            Core/Src/test_pedal_cal_limits.c \
            Core/Src/test_pedal_cal_session.c \
            Core/Src/test_pedalcal_can_frame.c \
            Core/Src/test_pedalcal_query_readonly.c \
            Core/Src/test_pedal_plausibility.c \
            Core/Src/test_busoff_recovery.c \
            Core/Src/test_motion_inhibit.c \
            Core/Src/test_relay_degraded.c \
            Core/Src/test_relay_health_diag.c \
            Core/Src/test_relay_health_frame.c \
            Core/Src/test_ina226_channel_diag.c \
            Core/Src/test_ina226_ch5_frame.c \
            Core/Src/test_loop_diag.c; do
            exe="/tmp/$(basename "$src" .c)"
            extra=""
            case "$src" in
              Core/Src/test_math_safety.c) extra="Core/Src/math_safety.c" ;;
              Core/Src/test_error_log.c) extra="Core/Src/error_log.c" ;;
              Core/Src/test_service_mode.c) extra="Core/Src/service_mode.c" ;;
              Core/Src/test_eps_params.c) extra="Core/Src/eps_params.c" ;;
              Core/Src/test_loop_diag.c) extra="Core/Src/loop_diag.c" ;;
              Core/Src/test_steering_z.c) extra="Core/Src/steering_z.c" ;;
              Core/Src/test_steering_centering.c) extra="Core/Src/steering_centering.c Core/Src/steering_centering_diag.c" ;;
              Core/Src/test_steering_centering_diag.c) extra="Core/Src/steering_centering_diag.c" ;;
              Core/Src/test_steering_centering_frame.c) extra="Core/Src/steering_centering_diag.c" ;;
              Core/Src/test_pedal_plausibility.c) extra="Core/Src/pedal_logic.c" ;;
              Core/Src/test_pedal_cal_session.c) extra="Core/Src/pedal_cal_session.c" ;;
              Core/Src/test_pedalcal_can_frame.c) extra="Core/Src/pedal_cal_session.c" ;;
              Core/Src/test_pedalcal_query_readonly.c) extra="Core/Src/pedal_cal_session.c" ;;
              Core/Src/test_busoff_recovery.c) extra="Core/Src/busoff_recovery.c" ;;
              Core/Src/test_motion_inhibit.c) extra="Core/Src/motion_inhibit.c" ;;
              Core/Src/test_relay_degraded.c) extra="Core/Src/motion_inhibit.c" ;;
              Core/Src/test_relay_health_diag.c) extra="Core/Src/relay_health_diag.c" ;;
              Core/Src/test_relay_health_frame.c) extra="Core/Src/relay_health_diag.c" ;;
              Core/Src/test_ina226_channel_diag.c) extra="Core/Src/ina226_channel_diag.c" ;;
              Core/Src/test_ina226_ch5_frame.c) extra="Core/Src/ina226_channel_diag.c" ;;
            esac
            echo "-- $(basename "$src")"
            gcc -std=c11 -DHOST_TEST -D_GNU_SOURCE \
              -Ianalysis_artifacts/stubs -ICore/Inc -O2 \
              "$src" $extra -lm -o "$exe"
            "$exe"
          done

      - name: Run affected ESP32 and heartbeat tests
        run: |
          set -euo pipefail
          chmod +x scripts/validate_can_heartbeat_local.sh
          ./scripts/validate_can_heartbeat_local.sh
          g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src -Iesp32/include -ICore/Inc \
            esp32/src/test_ina226_ch5_view.cpp Core/Src/ina226_channel_diag.c \
            -o /tmp/test_ina226_ch5_view
          /tmp/test_ina226_ch5_view
          g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src -Iesp32/include -ICore/Inc \
            esp32/src/test_relay_health_view.cpp Core/Src/relay_health_diag.c \
            -o /tmp/test_relay_health_view
          /tmp/test_relay_health_view
          g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src -Iesp32/include \
            esp32/src/test_steering_diag_view.cpp -o /tmp/test_steering_diag_view
          /tmp/test_steering_diag_view

      - name: Static analysis and full builds
        run: |
          set -euo pipefail
          chmod +x scripts/run_cppcheck.sh scripts/run_clang_tidy.sh scripts/run_static_analysis.sh scripts/check_integrity.sh
          ./scripts/run_static_analysis.sh
          make clean
          make -j2
          (cd esp32 && pio run -e esp32s3)
          ./scripts/check_integrity.sh

      - name: Restore normal CI, remove helper, and commit
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/firmware-validation.yml
          rm -f .github/workflows/apply-pr429-safety-fixes.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(safety): prevent false relay and steering INA faults"
          git push origin HEAD:fix/can-heartbeat-deterministic
