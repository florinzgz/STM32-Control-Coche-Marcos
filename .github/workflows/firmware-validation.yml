name: Firmware Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Core/**'
      - 'Drivers/**'
      - 'esp32/**'
      - 'Makefile'
      - 'scripts/**'
      - 'docs/**'
      - '.clang-tidy'
      - '.cppcheck-suppressions.txt'
      - '.github/workflows/firmware-validation.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Core/**'
      - 'Drivers/**'
      - 'esp32/**'
      - 'Makefile'
      - 'scripts/**'
      - 'docs/**'
      - '.clang-tidy'
      - '.cppcheck-suppressions.txt'
      - '.github/workflows/firmware-validation.yml'

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck flawfinder clang-tools
          python3 -m pip install --user lizard==1.17.10
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run static analysis
        run: |
          chmod +x scripts/run_cppcheck.sh scripts/run_clang_tidy.sh scripts/run_static_analysis.sh
          ./scripts/run_static_analysis.sh

      - name: Upload static-analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis
          path: artifacts/static-analysis/

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run STM32 host tests
        run: |
          set -euo pipefail
          mkdir -p artifacts/tests
          {
            for src in \
              Core/Src/test_motor_control.c \
              Core/Src/test_math_safety.c \
              Core/Src/test_error_log.c \
              Core/Src/test_service_mode.c \
              Core/Src/test_eps_params.c \
              Core/Src/test_sensor_calibration.c \
              Core/Src/test_wheel_speed.c \
              Core/Src/test_wheel_fault_gate.c \
              Core/Src/test_obstacle_fault_state.c \
              Core/Src/test_wheel_diag_can.c \
              Core/Src/test_gear_limits.c \
              Core/Src/test_drive_tuning.c \
              Core/Src/test_battery_limits.c \
              Core/Src/test_steering_cal_store.c \
              Core/Src/test_steering_z.c \
              Core/Src/test_steering_eps.c \
              Core/Src/test_steering_centering.c \
              Core/Src/test_steering_centering_diag.c \
              Core/Src/test_steering_centering_frame.c \
              Core/Src/test_pedal_cal_limits.c \
              Core/Src/test_pedal_cal_session.c \
              Core/Src/test_pedalcal_can_frame.c \
              Core/Src/test_pedalcal_query_readonly.c \
              Core/Src/test_pedal_plausibility.c \
              Core/Src/test_busoff_recovery.c \
              Core/Src/test_motion_inhibit.c \
              Core/Src/test_wheel_effort.c \
              Core/Src/test_relay_degraded.c \
              Core/Src/test_relay_health_diag.c \
              Core/Src/test_relay_health_frame.c \
              Core/Src/test_ina226_channel_diag.c \
              Core/Src/test_ina226_ch5_frame.c \
              Core/Src/test_loop_diag.c; do
              exe="/tmp/$(basename "$src" .c)"
              extra=""
              case "$src" in
                Core/Src/test_math_safety.c) extra="Core/Src/math_safety.c" ;;
                Core/Src/test_error_log.c) extra="Core/Src/error_log.c" ;;
                Core/Src/test_service_mode.c) extra="Core/Src/service_mode.c" ;;
                Core/Src/test_eps_params.c) extra="Core/Src/eps_params.c" ;;
                Core/Src/test_loop_diag.c) extra="Core/Src/loop_diag.c" ;;
                Core/Src/test_steering_z.c) extra="Core/Src/steering_z.c" ;;
                Core/Src/test_steering_eps.c) extra="Core/Src/steering_eps.c" ;;
                Core/Src/test_steering_centering.c) extra="Core/Src/steering_centering.c Core/Src/steering_centering_diag.c Core/Src/steering_eps.c" ;;
                Core/Src/test_steering_centering_diag.c) extra="Core/Src/steering_centering_diag.c" ;;
                Core/Src/test_steering_centering_frame.c) extra="Core/Src/steering_centering_diag.c" ;;
                Core/Src/test_pedal_plausibility.c) extra="Core/Src/pedal_logic.c" ;;
                Core/Src/test_pedal_cal_session.c) extra="Core/Src/pedal_cal_session.c" ;;
                Core/Src/test_pedalcal_can_frame.c) extra="Core/Src/pedal_cal_session.c" ;;
                Core/Src/test_pedalcal_query_readonly.c) extra="Core/Src/pedal_cal_session.c" ;;
                Core/Src/test_busoff_recovery.c) extra="Core/Src/busoff_recovery.c" ;;
                Core/Src/test_motion_inhibit.c) extra="Core/Src/motion_inhibit.c" ;;
                Core/Src/test_relay_degraded.c) extra="Core/Src/motion_inhibit.c" ;;
                Core/Src/test_relay_health_diag.c) extra="Core/Src/relay_health_diag.c" ;;
                Core/Src/test_relay_health_frame.c) extra="Core/Src/relay_health_diag.c" ;;
                Core/Src/test_ina226_channel_diag.c) extra="Core/Src/ina226_channel_diag.c" ;;
                Core/Src/test_ina226_ch5_frame.c) extra="Core/Src/ina226_channel_diag.c" ;;
              esac
              echo "-- $(basename "$src")"
              gcc -std=c11 -DHOST_TEST -D_GNU_SOURCE \
                -Ianalysis_artifacts/stubs -ICore/Inc -O2 \
                "$src" $extra -lm -o "$exe"
              "$exe"
            done

            # Section-L integration test: compiles the EFFECTIVE (patched)
            # relay sequencer + real EPS authority and proves PC12 stays OFF
            # after an EPS isolation while traction is preserved.  Needs the
            # opt-in functional GPIO model (HOST_TEST_GPIO_MODEL).
            echo "-- test_relay_seq_eps.c"
            gcc -std=c11 -DHOST_TEST -DHOST_TEST_GPIO_MODEL -D_GNU_SOURCE \
              -Ianalysis_artifacts/stubs -ICore/Inc -O2 \
              Core/Src/test_relay_seq_eps.c \
              Core/Src/safety_system_patched.c \
              Core/Src/steering_eps.c \
              Core/Src/math_safety.c \
              -lm -o /tmp/test_relay_seq_eps
            /tmp/test_relay_seq_eps

            # Section-M integration test: an isolable EPS fault at boot must
            # NEVER immobilise the vehicle (STANDBY -> ACTIVE, PC11 ON, PC12
            # OFF, power_ready) and the engineering relay override can never
            # pulse the steering-motor relay (PC12).  Needs the write observer.
            echo "-- test_eps_boot_traction.c"
            gcc -std=c11 -DHOST_TEST -DHOST_TEST_GPIO_MODEL \
              -DHOST_TEST_GPIO_WRITE_OBSERVER -D_GNU_SOURCE \
              -Ianalysis_artifacts/stubs -ICore/Inc -O2 \
              Core/Src/test_eps_boot_traction.c \
              Core/Src/safety_system_patched.c \
              Core/Src/steering_eps.c \
              Core/Src/boot_validation.c \
              Core/Src/math_safety.c \
              -lm -o /tmp/test_eps_boot_traction
            /tmp/test_eps_boot_traction

            # Section-M output-production test: an EPS fault injected in the
            # DETECTOR physically drives the real shared actuator registers to
            # their safe state (CCR PA6=0, CCR PA7=0, PC4 LOW, PC12 OFF).
            echo "-- test_steering_outputs.c"
            gcc -std=c11 -DHOST_TEST -DHOST_TEST_GPIO_MODEL \
              -DHOST_TEST_GPIO_WRITE_OBSERVER -D_GNU_SOURCE \
              -Ianalysis_artifacts/stubs -ICore/Inc -O2 \
              Core/Src/test_steering_outputs.c \
              Core/Src/steering_output.c \
              Core/Src/safety_system_patched.c \
              Core/Src/steering_eps.c \
              Core/Src/math_safety.c \
              -lm -o /tmp/test_steering_outputs
            /tmp/test_steering_outputs
            # Section-M centering-boot test: the REAL homing FSM
            # (SteeringCentering_Step) is driven to each of its four abort
            # causes (timeout / range / stall / encoder fault) and must
            # isolate the assist to MECHANICAL_ONLY while keeping traction
            # (STANDBY -> ACTIVE, PC11 ON, PC12 OFF & never re-armed).
            echo "-- test_centering_boot_traction.c"
            gcc -std=c11 -DHOST_TEST -DHOST_TEST_GPIO_MODEL \
              -DHOST_TEST_GPIO_WRITE_OBSERVER -D_GNU_SOURCE \
              -Ianalysis_artifacts/stubs -ICore/Inc -O2 \
              Core/Src/test_centering_boot_traction.c \
              Core/Src/steering_centering.c \
              Core/Src/steering_centering_diag.c \
              Core/Src/steering_eps.c \
              Core/Src/steering_output.c \
              Core/Src/safety_system_patched.c \
              Core/Src/boot_validation.c \
              Core/Src/math_safety.c \
              -lm -o /tmp/test_centering_boot_traction
            /tmp/test_centering_boot_traction

            # Section-M EPS assist supervisor: faults are injected into the
            # REAL detectors — the genuine Ina226_ClassifyChannel() plus the
            # real parameter/calibration/Z policy inputs — and the supervisor
            # is left to drive the real steering_eps.c isolation API (never
            # calling Steering_DisableAssistFault directly).  Proves every
            # isolable cause reaches EPS MECHANICAL_ONLY while a persistent
            # overcurrent escalates to ELECTRICAL_HAZARD + SAFE.
            echo "-- test_steering_supervisor.c"
            gcc -std=c11 -DHOST_TEST -D_GNU_SOURCE \
              -Ianalysis_artifacts/stubs -ICore/Inc -O2 \
              Core/Src/test_steering_supervisor.c \
              Core/Src/steering_supervisor.c \
              Core/Src/steering_eps.c \
              Core/Src/ina226_channel_diag.c \
              -lm -o /tmp/test_steering_supervisor
            /tmp/test_steering_supervisor

            # Encoder-Z MANDATORY policy: rebuild the supervisor with
            # STEERING_Z_REQUIRED=1 so the same detector injection proves a
            # missing/incoherent Z isolates the assist when Z is configured
            # mandatory (the default optional build treats it as diagnostic).
            echo "-- test_steering_supervisor.c (STEERING_Z_REQUIRED=1)"
            gcc -std=c11 -DHOST_TEST -DSTEERING_Z_REQUIRED=1 -D_GNU_SOURCE \
              -Ianalysis_artifacts/stubs -ICore/Inc -O2 \
              Core/Src/test_steering_supervisor.c \
              Core/Src/steering_supervisor.c \
              Core/Src/steering_eps.c \
              Core/Src/ina226_channel_diag.c \
              -lm -o /tmp/test_steering_supervisor_zreq
            /tmp/test_steering_supervisor_zreq
          } | tee artifacts/tests/stm32-host-tests.txt

      - name: Run ESP32 host tests
        run: |
          set -euo pipefail
          mkdir -p artifacts/tests
          {
            echo "-- test_relay_audio.cpp"
            g++ -std=c++17 esp32/src/relay_audio.cpp esp32/src/test_relay_audio.cpp \
              -Iesp32/src -Iesp32/test_stubs \
              -o /tmp/test_relay_audio
            /tmp/test_relay_audio

            echo "-- test_traction_switch.cpp"
            g++ -std=c++17 esp32/src/traction_switch.cpp esp32/src/test_traction_switch.cpp \
              -Iesp32/src -Iesp32/test_stubs \
              -o /tmp/test_traction_switch
            /tmp/test_traction_switch

            echo "-- test_remote_control.cpp"
            g++ -std=c++17 -DREMOTE_CONTROL_ENABLED=1 -DREMOTE_CONTROL_TEST_HOOKS \
              esp32/src/remote_control.cpp esp32/src/test_remote_control.cpp \
              -Iesp32/src -Iesp32/test_stubs \
              -o /tmp/test_remote_control
            /tmp/test_remote_control

            echo "-- test_shifter_input.cpp"
            g++ -std=c++17 esp32/src/shifter_input.cpp esp32/src/test_shifter_input.cpp \
              -Iesp32/src -Iesp32/test_stubs \
              -o /tmp/test_shifter_input
            /tmp/test_shifter_input

            echo "-- test_pedal_cal_decode.cpp"
            g++ -std=c++17 -DHOST_TEST esp32/src/test_pedal_cal_decode.cpp \
              -o /tmp/test_pedal_cal_decode
            /tmp/test_pedal_cal_decode

            echo "-- test_pedal_cal_session_view.cpp"
            g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src -Iesp32/include \
              esp32/src/test_pedal_cal_session_view.cpp \
              -o /tmp/test_pedal_cal_session_view
            /tmp/test_pedal_cal_session_view

            echo "-- test_pedal_decode.cpp"
            g++ -std=c++17 -DHOST_TEST esp32/src/test_pedal_decode.cpp \
              -o /tmp/test_pedal_decode
            /tmp/test_pedal_decode

            echo "-- test_wheel_diag_decode.cpp"
            g++ -std=c++17 -DHOST_TEST esp32/src/test_wheel_diag_decode.cpp \
              -o /tmp/test_wheel_diag_decode
            /tmp/test_wheel_diag_decode

            echo "-- test_wheel_diag_hint.cpp"
            g++ -std=c++17 -DHOST_TEST -Iesp32/include -Iesp32/src/ui \
              esp32/src/test_wheel_diag_hint.cpp \
              -o /tmp/test_wheel_diag_hint
            /tmp/test_wheel_diag_hint

            echo "-- test_stm32_liveness.cpp"
            g++ -std=c++17 -Wall -Wextra -Iesp32/src \
              esp32/src/test_stm32_liveness.cpp \
              -o /tmp/test_stm32_liveness
            /tmp/test_stm32_liveness

            echo "-- test_mode_sync.cpp"
            g++ -std=c++17 -Wall -Wextra -Iesp32/src -Iesp32/test_stubs \
              esp32/src/traction_switch.cpp esp32/src/test_mode_sync.cpp \
              -o /tmp/test_mode_sync
            /tmp/test_mode_sync

            echo "-- test_motion_inhibit_decode.cpp"
            g++ -std=c++17 -Wall -Wextra -DHOST_TEST \
              esp32/src/test_motion_inhibit_decode.cpp \
              -o /tmp/test_motion_inhibit_decode
            /tmp/test_motion_inhibit_decode

            echo "-- test_motion_inhibit_view.cpp"
            g++ -std=c++17 -Wall -Wextra -Iesp32/src -Iesp32/include \
              esp32/src/test_motion_inhibit_view.cpp \
              -o /tmp/test_motion_inhibit_view
            /tmp/test_motion_inhibit_view

            echo "-- test_boot_diag.cpp"
            g++ -std=c++17 -Wall -Wextra -Iesp32/src \
              esp32/src/test_boot_diag.cpp \
              -o /tmp/test_boot_diag
            /tmp/test_boot_diag

            echo "-- test_rgb_diag_timing.cpp"
            g++ -std=c++17 -Wall -Wextra -Iesp32/src -Iesp32/include \
              esp32/src/test_rgb_diag_timing.cpp \
              -o /tmp/test_rgb_diag_timing
            /tmp/test_rgb_diag_timing

            echo "-- test_twai_recovery.cpp"
            g++ -std=c++17 -Wall -Wextra -Iesp32/src \
              esp32/src/test_twai_recovery.cpp \
              -o /tmp/test_twai_recovery
            /tmp/test_twai_recovery

            echo "-- test_eps_limits_contract.cpp"
            g++ -std=c++17 -Wall -Wextra -Iesp32/src \
              esp32/src/test_eps_limits_contract.cpp \
              -o /tmp/test_eps_limits_contract
            /tmp/test_eps_limits_contract

            echo "-- test_wheel_traction.cpp"
            g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src \
              esp32/src/test_wheel_traction.cpp \
              -o /tmp/test_wheel_traction
            /tmp/test_wheel_traction

            echo "-- test_display_supervisor.cpp"
            g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src \
              esp32/src/test_display_supervisor.cpp \
              -o /tmp/test_display_supervisor
            /tmp/test_display_supervisor

            echo "-- test_steering_diag_view.cpp"
            g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src -Iesp32/include \
              esp32/src/test_steering_diag_view.cpp \
              -o /tmp/test_steering_diag_view
            /tmp/test_steering_diag_view

            echo "-- test_relay_health_view.cpp"
            g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src -Iesp32/include -ICore/Inc \
              esp32/src/test_relay_health_view.cpp Core/Src/relay_health_diag.c \
              -o /tmp/test_relay_health_view
            /tmp/test_relay_health_view

            echo "-- test_ina226_ch5_view.cpp"
            g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src -Iesp32/include -ICore/Inc \
              esp32/src/test_ina226_ch5_view.cpp Core/Src/ina226_channel_diag.c \
              -o /tmp/test_ina226_ch5_view
            /tmp/test_ina226_ch5_view

            echo "-- test_frame_parity_cross.cpp"
            g++ -std=c++17 -Wall -Wextra -Werror -DHOST_TEST \
              -ICore/Inc -Iesp32/src -Iesp32/include \
              esp32/src/test_frame_parity_cross.cpp \
              -o /tmp/test_frame_parity_cross
            /tmp/test_frame_parity_cross

            echo "-- test_display_recovery.cpp"
            g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src \
              esp32/src/test_display_recovery.cpp \
              -o /tmp/test_display_recovery
            /tmp/test_display_recovery

            echo "-- test_ack_tracker.cpp"
            g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src \
              esp32/src/test_ack_tracker.cpp \
              -o /tmp/test_ack_tracker
            /tmp/test_ack_tracker

            echo "-- test_ack_fifo.cpp"
            g++ -std=c++17 -Wall -Wextra -Werror -Iesp32/src -Iesp32/include \
              esp32/src/test_ack_fifo.cpp \
              -o /tmp/test_ack_fifo
            /tmp/test_ack_fifo
          } | tee artifacts/tests/esp32-host-tests.txt

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-tests
          path: artifacts/tests/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build STM32 firmware
        run: |
          set -euo pipefail
          mkdir -p artifacts/build
          make clean
          make -j2 2>&1 | tee artifacts/build/stm32-make.txt

      - name: Build ESP32 firmware (PlatformIO)
        run: |
          set -euo pipefail
          mkdir -p artifacts/build
          python3 -m pip install --upgrade pip
          python3 -m pip install --user platformio
          export PATH="$HOME/.local/bin:$PATH"
          (
            cd esp32
            pio run -e esp32s3
          ) 2>&1 | tee artifacts/build/esp32-platformio.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: artifacts/build/

  integrity-check:
    runs-on: ubuntu-latest
    needs: [tests, build]
    env:
      EXPECTED_HAL_VERSION: "V1.2.2"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run integrity checks
        run: ./scripts/check_integrity.sh

  optional-codeql:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual

      - name: Build STM32 firmware for CodeQL
        run: |
          make clean
          make -j2

      - name: Analyze
        uses: github/codeql-action/analyze@v4
